<!doctype html>
<!-- ================================================================
     ==== SEC:HEADER (BEGIN) ========================================
     Articulate 2.0
     Everything is an entry; relations are typed edges; "task",
     "status", and "interval" are conventions expressed as ordinary
     entries, views, and tabs. A first-run seed provides a default
     working configuration.

     Storage identifiers (localStorage keys, the Drive sync filename,
     NDJSON record tags) are stable wire-level names; they are kept
     constant across releases so data always outlives the code.

     Schema (all references by persistent ID; only id/created_at
     immutable; soft delete everywhere; every record carries
     updated_at, bumped on mutation, for last-write-wins merging):
       IDs        globally unique strings "{deviceId}-{letter}{n}"
                  (letter: e entry, g edge, t linktype, v view, b tab)
                  so records created offline on different devices
                  never collide. deviceId is per-install, stored
                  OUTSIDE the DB and never synced.
       entries    id, created_at, ts, updated_at, title, body,
                  estimate_min, deleted
       edges      id, from_id, to_id, type_id, created_at,
                  updated_at, deleted
                  (child edge points child -> parent; ends edge
                   points end-entry -> start-entry)
       linkTypes  id, name, locked, updated_at, deleted
       views      id, name, cond_ids[] (ancestor conditions, ANDed),
                  type_ids[] (containment link types), locked,
                  updated_at, deleted
       tabs       id, cls, label, pos, cfg{...}, updated_at
                  cls ∈ create | interval | explore | exclusive |
                  views | links | tabs
       settings   allViewId, mem{fieldKey -> id}, migratedV1,
                  idsMigrated, dirty (false only while the DB holds
                  nothing but seed data; a pristine device ADOPTS
                  incoming sync data instead of merging, so two
                  fresh seeds never duplicate keystones)

     SECTION MANIFEST (grep "SEC:"; every section has (BEGIN)/(END)):
       SEC:HEADER              this manifest
       SEC:STYLE               all CSS
         SEC:STYLE/TOKENS        palette, type, radii
         SEC:STYLE/BASE          resets, shell, typography
         SEC:STYLE/RUNBAR        running-intervals bar
         SEC:STYLE/NAV           scrollable bottom tab bar
         SEC:STYLE/TREE          shared entry tree rows
         SEC:STYLE/CHIPS         chips & badges
         SEC:STYLE/FORMS         inputs, editor fields
         SEC:STYLE/LISTS         config lists (views/links/tabs)
         SEC:STYLE/MODAL         modal stack & scrim
         SEC:STYLE/MISC          menu, toast, banner, empty
       SEC:MARKUP              static DOM shell
       SEC:APP                 all JavaScript
         SEC:APP/UTIL            dom/date/format helpers
         SEC:APP/STORE           persistence + flush-on-hide
         SEC:APP/IDS             device id, id factory, migration of
                                 legacy numeric ids to global ids
         SEC:APP/MODEL           CRUD for all five tables (+touch)
         SEC:APP/SEED            first-run seed (fixed 'seed-…' ids)
         SEC:APP/MIGRATE         legacy-store import (capturelog.v1)
         SEC:APP/QUERY           containment, view matching, trees,
                                 paths, search, running intervals
         SEC:APP/EXPORT          NDJSON serialize/parse/export
         SEC:APP/MERGE           union + last-write-wins merge
         SEC:APP/SYNC            Google Drive sync: realm pointer,
                                 pull-merge-push, snapshots, resets
         SEC:APP/UI              view layer
           SEC:APP/UI/ROOT         tab bar, routing, rerender
           SEC:APP/UI/RUNBAR       live running-interval summary
           SEC:APP/UI/MODAL        modal stack infrastructure
           SEC:APP/UI/TREE         shared tree renderer
           SEC:APP/UI/CHIPS        shared chip builders
           SEC:APP/UI/TAB_CREATE   "+" capture tab
           SEC:APP/UI/TAB_INTERVAL "🕓" interval pair tab
           SEC:APP/UI/TAB_EXPLORE  "🧭" browse/edit tab
           SEC:APP/UI/TAB_EXCL     "☑" exclusive-swap tab
           SEC:APP/UI/TAB_VIEWS    "🔎" view config tab
           SEC:APP/UI/TAB_LINKS    "🔗" link-type config tab
           SEC:APP/UI/TAB_TABS     "🕮" tab config tab
           SEC:APP/UI/EDITOR       entry editor modal
           SEC:APP/UI/PICK_ENTRY   entry picker (search+tree+add)
           SEC:APP/UI/PICK_VIEW    view picker
           SEC:APP/UI/PICK_TYPE    link-type picker
           SEC:APP/UI/PANEL_EXCL   exclusive swap panel
           SEC:APP/UI/EDIT_VIEW    view editor modal
           SEC:APP/UI/EDIT_TAB     tab config modal
           SEC:APP/UI/MENU         the ⋯ tab: sync/export/resets
         SEC:APP/BOOT            init
     ==== SEC:HEADER (END) ========================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131518">
<title>Articulate</title>
<style>
/* ==== SEC:STYLE (BEGIN) ============================================ */

/* ==== SEC:STYLE/TOKENS (BEGIN) ==== */
:root{
  --bg:#131518; --surface:#1b1e23; --surface2:#23272e; --line:#2c313a;
  --ink:#e7e4db; --muted:#8f939c; --faint:#5c616b;
  --accent:#93b878; --accent-dim:#3a4a33; --amber:#d9a44a; --danger:#c96f5e;
  --r:12px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
/* ==== SEC:STYLE/TOKENS (END) ==== */

/* ==== SEC:STYLE/BASE (BEGIN) ==== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{display:flex;flex-direction:column;height:100dvh}
#view{flex:1;overflow-y:auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r);outline:none}
input:focus,textarea:focus{border-color:var(--accent-dim)}
::placeholder{color:var(--faint)}
.mono{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ==== SEC:STYLE/BASE (END) ==== */

/* ==== SEC:STYLE/RUNBAR (BEGIN) ==== */
#runbar{display:none;align-items:center;gap:8px;padding:9px 14px;
  padding-top:calc(9px + env(safe-area-inset-top));overflow-x:auto;
  background:linear-gradient(180deg,#182016,var(--bg));border-bottom:1px solid var(--accent-dim)}
#runbar.on{display:flex}
#runbar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
  flex-shrink:0;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#runbar .rchip{display:inline-flex;gap:7px;align-items:center;white-space:nowrap;
  border:1px solid var(--accent-dim);border-radius:999px;padding:4px 11px;font-size:13px}
#runbar .rchip .el{font-family:var(--mono);color:var(--accent);font-size:12px}
/* ==== SEC:STYLE/RUNBAR (END) ==== */

/* ==== SEC:STYLE/NAV (BEGIN) ==== */
#tabs{display:flex;overflow-x:auto;flex-shrink:0;
  background:color-mix(in srgb,var(--bg) 88%,black);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#tabs button{flex:1 0 60px;padding:9px 4px 11px;color:var(--faint);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
#tabs button .ico{font-size:20px;line-height:1}
#tabs button.active{color:var(--ink)}
#tabs button.active .ico{filter:none;color:var(--accent)}
/* ==== SEC:STYLE/NAV (END) ==== */

/* ==== SEC:STYLE/TREE (BEGIN) ==== */
.trow{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:10px;width:100%;text-align:left}
.trow:active{background:var(--surface)}
/* 44x44 minimum touch targets (Apple HIG 44pt / WCAG 2.5.5) for the
   collapse, expand-all, and row-action buttons; glyphs stay modest. */
.trow .chev{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:var(--faint);font-size:15px}
.trow .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nm.untitled{color:var(--muted);font-style:italic}
.trow .nm.hit{color:var(--accent)}
.trow .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);padding:0 4px}
.trow .tbtn{width:44px;height:44px;flex-shrink:0;color:var(--faint);font-size:16px;
  border:1px solid transparent;border-radius:10px;display:flex;align-items:center;justify-content:center}
.trow .tbtn.add{color:var(--accent)}
.trow .tbtn.end{color:var(--accent);border-color:var(--accent-dim);font-size:12px;width:auto;padding:0 12px}
.flatrow{display:block;width:100%;text-align:left;padding:8px 6px;border-radius:10px}
.flatrow:active{background:var(--surface)}
.flatrow .path{font-family:var(--mono);font-size:11px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flatrow .line{display:flex;gap:8px;align-items:baseline}
.flatrow .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.flatrow .tm{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;flex-shrink:0}
/* ==== SEC:STYLE/TREE (END) ==== */

/* ==== SEC:STYLE/CHIPS (BEGIN) ==== */
.chip{display:inline-flex;align-items:center;gap:6px;max-width:60vw;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:13px;color:var(--ink);white-space:nowrap}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip.linked{border-color:var(--accent-dim);background:#20261e}
.chip.add{color:var(--muted);border-style:dashed}
.chip.sel{border-color:var(--accent);background:#243020}
.chip .ty{font-family:var(--mono);font-size:10px;color:var(--faint);
  border-left:1px solid var(--line);padding-left:6px}
.chip .x{color:var(--faint);font-size:15px;padding-left:2px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
/* ==== SEC:STYLE/CHIPS (END) ==== */

/* ==== SEC:STYLE/FORMS (BEGIN) ==== */
.f-toprow{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
/* The timestamp is a tap-to-edit label (native inline datetime widgets
   can't follow the display rules or drop their picker arrow); the real
   input is invisible underneath and only its picker dialog is used. */
.tsbtn{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:4px 8px;border-radius:10px;cursor:pointer;color-scheme:dark}
.tsbtn:active{background:var(--surface2)}
.tsbtn .tslbl{display:flex;flex-direction:column;line-height:1.15;text-align:center;
  font-family:var(--mono);pointer-events:none}
.tsbtn .tslbl .d{font-size:10px;color:var(--faint)}
.tsbtn .tslbl .t{font-size:13px;color:var(--muted)}
.tsbtn .tsnative{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;pointer-events:none}
.f-toprow .f-title{flex:1;min-width:0;margin:0}
.tbtn-add{width:44px;height:44px;flex-shrink:0;color:var(--accent);font-size:20px;
  border:1px solid var(--accent-dim);border-radius:10px}
.f-created{font-family:var(--mono);font-size:11px;color:var(--faint)}
.f-title{width:100%;padding:10px 12px;font-size:15px;margin-bottom:8px;background:transparent;border:1px dashed var(--line)}
.f-title:focus{border-style:solid}
.f-body{width:100%;min-height:30dvh;padding:12px;font-size:17px;line-height:1.5;resize:vertical}
.f-body.short{min-height:80px;font-size:15px}
.f-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 2px 7px}
.f-field{padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);
  color:var(--faint);font-size:14px;width:100%;text-align:left}
.f-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f-row .f-field{flex:1;width:auto;min-width:0}
.bigbtn{margin-top:14px;width:100%;padding:12px;border:1px solid var(--line);
  border-radius:var(--r);color:var(--muted);font-size:14px;background:var(--surface)}
.bigbtn.go{color:var(--accent);border-color:var(--accent-dim)}
.dangerbtn{margin-top:18px;color:var(--danger);font-size:13px;padding:9px 0}
.bigbtn.danger{color:var(--danger);border-color:#4a332e}
/* ==== SEC:STYLE/FORMS (END) ==== */

/* ==== SEC:STYLE/LISTS (BEGIN) ==== */
.cfg-row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:var(--r);width:100%;text-align:left}
.cfg-row:active{background:var(--surface)}
.cfg-row .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-row .mt{font-family:var(--mono);font-size:11px;color:var(--faint);flex-shrink:0}
.cfg-row .mini{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line);
  border-radius:8px;color:var(--muted);font-size:14px}
.sorttog{font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px}
/* ==== SEC:STYLE/LISTS (END) ==== */

/* ==== SEC:STYLE/MODAL (BEGIN) ==== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
#scrim.on{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column}  /* top set per stack depth in Modal.render */
.modal .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;flex-shrink:0}
.modal .mbody{overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.modal .mtop{display:flex;gap:10px;padding:6px 16px 10px;align-items:center;flex-shrink:0}
.modal .mtop input{flex:1;padding:9px 12px;font-size:16px}
.modal .mtop .cancel{color:var(--muted);font-size:14px;flex-shrink:0}
/* ==== SEC:STYLE/MODAL (END) ==== */

/* ==== SEC:STYLE/MISC (BEGIN) ==== */
#membanner{display:none;background:#3a2f1a;color:var(--amber);font-size:12px;padding:7px 14px;text-align:center}
#membanner.on{display:block}
.diag-val{max-width:58%;text-align:right;word-break:break-all} /* keeps diagnostics rows readable on narrow screens */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.empty{color:var(--faint);text-align:center;padding:40px 20px;font-size:14px}
/* ==== SEC:STYLE/MISC (END) ==== */

/* ==== SEC:STYLE (END) ============================================== */
</style>
</head>
<body>
<!-- ==== SEC:MARKUP (BEGIN) ========================================== -->
<div id="app">
  <div id="membanner">Memory-only mode — storage unavailable here. Export from ⋯ to keep data.</div>
  <nav id="tabs"></nav>
  <div id="runbar"><span class="dot"></span></div>
  <div id="view"></div>
</div>
<div id="scrim"></div>
<div id="mstack"></div>
<input type="file" id="importfile" accept=".ndjson,.txt,.json" style="display:none">
<div id="toast"></div>
<!-- ==== SEC:MARKUP (END) ============================================ -->

<script>
// ==== SEC:APP (BEGIN) =================================================

// ==== SEC:APP/UTIL (BEGIN) ====
const MAX_SNAPSHOT_LABEL_LENGTH=80;
const $  = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag);
  if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const nowISO = () => new Date().toISOString();
// Timestamp display: today -> "14:05"; within the last week ->
// "tue 14:05"; older or future -> "tue 7 jul 14:05"; and outside the
// current year the two-digit year follows the month: "tue 7 jul 25 14:05".
// fmtDTParts returns {date, time}; date is '' when the moment is today.
function fmtDTParts(iso){
  const d=new Date(iso); if(isNaN(d)) return {date:'',time:''};
  const now=new Date(), p=n=>String(n).padStart(2,'0');
  const time=p(d.getHours())+':'+p(d.getMinutes());
  const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const ago=(day0(now)-day0(d))/86400000;          // whole days in the past
  if(ago===0) return {date:'',time};
  const dow=['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];
  if(ago>0&&ago<7) return {date:dow,time};
  const mon=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][d.getMonth()];
  return {date:dow+' '+d.getDate()+' '+mon
    +(d.getFullYear()===now.getFullYear()?'':' '+p(d.getFullYear()%100)),time}; }
function fmtDT(iso){ const x=fmtDTParts(iso); return x.date?x.date+' '+x.time:x.time; }
function fmtDur(ms){ if(ms<0)ms=0; const m=Math.round(ms/60000);
  if(m<60) return m+'m'; const h=Math.floor(m/60),r=m%60; return r? h+'h '+r+'m' : h+'h'; }
function toLocalInput(iso){ const d=new Date(iso),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function fromLocalInput(v){ const d=new Date(v); return isNaN(d)?null:d.toISOString(); }
function disp(e){ return e.title || (e.body||'').split('\n')[0].slice(0,60) || '· '+fmtDT(e.ts); }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1700); }
function fuzzy(q,s){ q=q.toLowerCase(); s=(s||'').toLowerCase();
  if(!q) return 0;
  const i=s.indexOf(q); if(i>=0) return 10-Math.min(9,i*0.5);
  let j=0; for(const ch of s){ if(ch===q[j])j++; if(j===q.length) return 2; }
  return -1; }
// ==== SEC:APP/UTIL (END) ====

// ==== SEC:APP/STORE (BEGIN) ====
// localStorage with in-memory fallback + loud banner (P2). Saves are
// debounced 120ms; saveNow() flushes, and is wired to visibilitychange
// and pagehide so a pocketed or dying phone commits the latest keystrokes.
const STORE_KEY='capturelog.v2';
const Store={ memoryOnly:false, _mem:null,
  read(k){ try{ return localStorage.getItem(k); }catch(e){ this.memoryOnly=true; return k===STORE_KEY?this._mem:null; } },
  write(str){ try{ localStorage.setItem(STORE_KEY,str); this.memoryOnly=false; }
    catch(e){ this.memoryOnly=true; this._mem=str; }
    $('#membanner').classList.toggle('on',this.memoryOnly); } };

let DB={ v:2,
  entries:[], edges:[], linkTypes:[], views:[], tabs:[],
  settings:{ allViewId:null, mem:{}, migratedV1:false, idsMigrated:false, dirty:false } };

let saveTimer=null;
let scheduleDriveSync=()=>{};          // replaced by SEC:APP/SYNC once defined
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,120); }
function persistNow(){ clearTimeout(saveTimer); Store.write(JSON.stringify(DB)); } // SEC:APP/STORE: silent write path
function saveNow(opts){ persistNow();
  if(!opts||opts.schedule!==false) scheduleDriveSync(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveNow(); });
window.addEventListener('pagehide',saveNow);
function load(){ const raw=Store.read(STORE_KEY);
  if(raw){ try{ DB=JSON.parse(raw); }catch(e){ console.error('load failed',e); } }
  if(!DB.settings) DB.settings={};
  if(!DB.settings.mem) DB.settings.mem={};
  $('#membanner').classList.toggle('on',Store.memoryOnly); }
// ==== SEC:APP/STORE (END) ====

// ==== SEC:APP/IDS (BEGIN) ====
// Globally unique IDs so multi-device merges can't collide.
// deviceId is per-install (kept outside the DB, never synced). New ids
// are "{dev}-{letter}{n}"; counters are derived on boot by scanning
// this device's own ids, so they need no persistence of their own.
function deviceId(){
  let d=null; try{ d=localStorage.getItem('capturelog.device'); }catch(e){}
  if(!d){
    const c=window.crypto;
    // SEC:APP/IDS: prefer strong device IDs for cross-device uniqueness.
    if(c&&typeof c.randomUUID==='function') d=c.randomUUID();
    else if(c&&typeof c.getRandomValues==='function'){
      const b=new Uint8Array(16); c.getRandomValues(b);
      d=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    } else d=(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14));
    try{ localStorage.setItem('capturelog.device',d); }catch(e){} }
  return d; }
let COUNTERS={};
function initCounters(){
  const dev=deviceId(); COUNTERS={};
  const scan=(arr,letter)=>{ let mx=0; const pre=dev+'-'+letter;
    arr.forEach(r=>{ if(typeof r.id==='string'&&r.id.startsWith(pre)){
      const n=parseInt(r.id.slice(pre.length),10); if(n>mx)mx=n; } });
    COUNTERS[letter]=mx+1; };
  scan(DB.entries,'e'); scan(DB.edges,'g'); scan(DB.linkTypes,'t');
  scan(DB.views,'v'); scan(DB.tabs,'b'); }
function newId(letter){ return deviceId()+'-'+letter+(COUNTERS[letter]++); }

// One-shot migration of legacy numeric ids: ids become device-prefixed
// strings; every reference field is rewritten via the old->new maps;
// updated_at is backfilled; tabs get explicit pos.
function migrateIds(){
  const s=DB.settings;
  if(s.idsMigrated){ return; }
  const dev=deviceId();
  const mk=(arr,letter)=>{ const m=new Map();
    arr.forEach(r=>{ const nid=dev+'-'+letter+r.id; m.set(r.id,nid); r.id=nid;
      if(!r.updated_at) r.updated_at=r.created_at||nowISO(); });
    return m; };
  const em=mk(DB.entries,'e'), gm=mk(DB.edges,'g'), tm=mk(DB.linkTypes,'t'),
        vm=mk(DB.views,'v'), bm=mk(DB.tabs,'b');
  DB.edges.forEach(d=>{ d.from_id=em.get(d.from_id)??d.from_id;
    d.to_id=em.get(d.to_id)??d.to_id; d.type_id=tm.get(d.type_id)??d.type_id; });
  DB.views.forEach(v=>{ v.cond_ids=(v.cond_ids||[]).map(x=>em.get(x)??x);
    v.type_ids=(v.type_ids||[]).map(x=>tm.get(x)??x); });
  DB.tabs.forEach((t,i)=>{ if(t.pos==null)t.pos=i+1; const c=t.cfg||{};
    if(c.root_id!=null)c.root_id=em.get(c.root_id)??c.root_id;
    ['link_type_id','end_type_id'].forEach(k=>{ if(c[k]!=null)c[k]=tm.get(c[k])??c[k]; });
    ['view_id','list_view_id','swap_view_id'].forEach(k=>{ if(c[k]!=null)c[k]=vm.get(c[k])??c[k]; });
    if(c.def&&c.def.links)c.def.links.forEach(l=>{ l.to=em.get(l.to)??l.to;
      l.type=tm.get(l.type)??l.type; }); });
  if(s.allViewId!=null) s.allViewId=vm.get(s.allViewId)??s.allViewId;
  const mem={};
  Object.entries(s.mem||{}).forEach(([k,val])=>{
    const nk=k.replace(/^tab(\d+)\./,(_,n)=>'tab'+(bm.get(+n)??n)+'.');
    mem[nk]=vm.get(val)??tm.get(val)??val; });
  s.mem=mem;
  if(DB.entries.length) s.dirty=true;      // real data present -> merges, never adopted-over

// ==== SEC:APP/IDS (END) ====

// ==== SEC:APP/MODEL (BEGIN) ====
// CRUD. Soft delete everywhere; id + created_at immutable (P4).
// touch() bumps updated_at (the merge clock) and marks the DB dirty
// (i.e. containing more than seed data). Every mutation must touch.
function touch(r){ r.updated_at=nowISO(); DB.settings.dirty=true; }

function createEntry(f={}){ const t=nowISO();
  const e={id:newId('e'),created_at:t,ts:t,updated_at:t,
    title:null,body:null,estimate_min:null,deleted:0,...f};
  DB.entries.push(e); DB.settings.dirty=true; save(); return e; }
function getEntry(id){ return DB.entries.find(e=>e.id===id&&!e.deleted); }
function updateEntry(id,p){ const e=getEntry(id); if(!e)return null;
  delete p.id; delete p.created_at; Object.assign(e,p); touch(e); save(); return e; }
function deleteEntry(id){ const e=getEntry(id); if(!e)return;
  e.deleted=1; touch(e);
  DB.edges.forEach(d=>{ if(d.from_id===id||d.to_id===id){d.deleted=1;touch(d);} }); save(); }

function addEdge(from_id,to_id,type_id){ if(from_id===to_id) return null;
  const dup=DB.edges.find(d=>!d.deleted&&d.from_id===from_id&&d.to_id===to_id&&d.type_id===type_id);
  if(dup) return dup;
  const t=nowISO();
  const d={id:newId('g'),from_id,to_id,type_id,created_at:t,updated_at:t,deleted:0};
  DB.edges.push(d); DB.settings.dirty=true; save(); return d; }
function removeEdge(id){ const d=DB.edges.find(x=>x.id===id); if(d){d.deleted=1;touch(d);save();} }
function retypeEdge(id,type_id){ const d=DB.edges.find(x=>x.id===id&&!x.deleted);
  if(d){d.type_id=type_id;touch(d);save();} }
const liveEdges=()=>DB.edges.filter(d=>!d.deleted);

function createLinkType(name,locked=0){ const t0=nowISO();
  const t={id:newId('t'),name,locked,updated_at:t0,deleted:0};
  DB.linkTypes.push(t); DB.settings.dirty=true; save(); return t; }
function getType(id){ return DB.linkTypes.find(t=>t.id===id&&!t.deleted); }
const liveTypes=()=>DB.linkTypes.filter(t=>!t.deleted);

function createView(f){ const t0=nowISO();
  const v={id:newId('v'),name:'view',cond_ids:[],type_ids:[],locked:0,updated_at:t0,deleted:0,...f};
  DB.views.push(v); DB.settings.dirty=true; save(); return v; }
function getView(id){ return DB.views.find(v=>v.id===id&&!v.deleted); }
const liveViews=()=>DB.views.filter(v=>!v.deleted);
function fallbackView(){ return getView(DB.settings.allViewId)||liveViews()[0]; }

function createTab(cls,label,cfg={}){ const t0=nowISO();
  const pos=Math.max(0,...DB.tabs.filter(x=>!x.deleted).map(x=>x.pos||0))+1;
  const t={id:newId('b'),cls,label,pos,cfg,updated_at:t0,deleted:0};
  DB.tabs.push(t); DB.settings.dirty=true; save(); return t; }
function getTab(id){ return DB.tabs.find(t=>t.id===id&&!t.deleted); }
const liveTabs=()=>DB.tabs.filter(t=>!t.deleted).sort((a,b)=>(a.pos||0)-(b.pos||0));

// per-field view memory: fieldKey -> view id
const Mem={
  get(key,fb){ const id=DB.settings.mem[key]; return getView(id)||getView(fb)||fallbackView(); },
  set(key,viewId){ DB.settings.mem[key]=viewId; save(); } };
// ==== SEC:APP/MODEL (END) ====

// ==== SEC:APP/SEED (BEGIN) ====
// First run: seed link types, keystone entries, views, and the default
// tab set. Seed records carry FIXED ids ('seed-…'), identical on every
// device, so independently seeded stores contain literally the same
// records and the sync merge (SEC:APP/MERGE) unions them into a single
// copy of each. Everything seeded is ordinary data — retitle,
// reconfigure, or (mostly) delete at will. "All" and the engine tabs
// are locked.
function seed(){
  if(DB.linkTypes.length||DB.entries.length) return;
  const t0=nowISO();
  const mkType=(id,name)=>{ const t={id,name,locked:1,updated_at:t0,deleted:0};
    DB.linkTypes.push(t); return t; };
  const mkEntry=(id,title)=>{ const e={id,created_at:t0,ts:t0,updated_at:t0,
    title,body:null,estimate_min:null,deleted:0}; DB.entries.push(e); return e; };
  const mkEdge=(id,from,to,type)=>DB.edges.push({id,from_id:from.id,to_id:to.id,
    type_id:type.id,created_at:t0,updated_at:t0,deleted:0});
  const mkView=(id,f)=>{ const v={id,name:'view',cond_ids:[],type_ids:[],locked:0,
    updated_at:t0,deleted:0,...f}; DB.views.push(v); return v; };
  let pos=0;
  const mkTab=(id,cls,label,cfg)=>DB.tabs.push({id,cls,label,pos:++pos,cfg,
    updated_at:t0,deleted:0});
  const child=mkType('seed-t-child','child');
  const ends =mkType('seed-t-ends','ends');
  const status=mkEntry('seed-e-status','Status');
  const active=mkEntry('seed-e-active','Active');
  const someday=mkEntry('seed-e-someday','Someday');
  const done=mkEntry('seed-e-done','Done');
  const dead=mkEntry('seed-e-dead','Dead');
  [active,someday,done,dead].forEach(s=>
    mkEdge('seed-g-'+s.id.slice('seed-e-'.length)+'-status',s,status,child));
  const intervals=mkEntry('seed-e-intervals','Intervals');
  const all=mkView('seed-v-all',{name:'All',type_ids:[child.id,ends.id],locked:1});
  const vAct=mkView('seed-v-active',{name:'Active',cond_ids:[active.id],type_ids:[child.id]});
  const vStat=mkView('seed-v-statuses',{name:'Statuses',cond_ids:[status.id],type_ids:[child.id]});
  DB.settings.allViewId=all.id;
  mkTab('seed-b-create','create','＋',{});
  mkTab('seed-b-interval','interval','🕓',{root_id:intervals.id,link_type_id:child.id,end_type_id:ends.id});
  mkTab('seed-b-explore','explore','🧭',{view_id:all.id});
  mkTab('seed-b-exclusive','exclusive','☑',{list_view_id:vAct.id,swap_view_id:vStat.id,link_type_id:child.id});
  mkTab('seed-b-views','views','🔎',{});
  mkTab('seed-b-links','links','🔗',{});
  mkTab('seed-b-tabs','tabs','🕮',{});
  DB.settings.idsMigrated=true;   // fresh DBs are born with global ids
  DB.settings.dirty=false;
  saveNow({schedule:false});
}
// ==== SEC:APP/SEED (END) ====

// ==== SEC:APP/MIGRATE (BEGIN) ====
// One-shot import from the legacy store (localStorage key
// capturelog.v1), run after seed so keystone entries exist. Mapping
// from that format: 'session' edges become child links (start->task);
// 'session_end' edges become ends links; task_state becomes a child
// link to the matching Status entry. The legacy store is read-only
// here and left in place.
function migrateV1(){
  if(DB.settings.migratedV1) return;
  DB.settings.migratedV1=true;
  const raw=Store.read('capturelog.v1'); if(!raw){ save(); return; }
  let old; try{ old=JSON.parse(raw); }catch(e){ save(); return; }
  if(!old.entries||!old.entries.length){ save(); return; }
  const child=liveTypes().find(t=>t.name==='child'), ends=liveTypes().find(t=>t.name==='ends');
  const statusByName={}; ['Active','Someday','Done','Dead'].forEach(n=>{
    statusByName[n.toLowerCase()]=DB.entries.find(e=>!e.deleted&&e.title===n); });
  const idMap={};
  old.entries.forEach(oe=>{
    const ne=createEntry({title:oe.title||null,body:oe.body||null,
      estimate_min:oe.estimate_min||null,deleted:oe.deleted?1:0});
    ne.ts=oe.ts||ne.ts; ne.created_at=oe.created_at||ne.created_at;   // preserve history
    idMap[oe.id]=ne.id;
    if(oe.is_task&&oe.task_state&&statusByName[oe.task_state])
      addEdge(ne.id,statusByName[oe.task_state].id,child.id);
  });
  (old.edges||[]).forEach(od=>{
    const f=idMap[od.from_id],t=idMap[od.to_id]; if(!f||!t)return;
    const type = od.type==='session_end'?ends.id:child.id;   // session & child -> child
    const d=addEdge(f,t,type); if(d&&od.deleted)d.deleted=1;
  });
  save(); toast('Imported '+old.entries.length+' entries from legacy storage');
}
// ==== SEC:APP/MIGRATE (END) ====

// ==== SEC:APP/QUERY (BEGIN) ====
// All derived state. Containment is a per-view property: traversals
// take the view's type_ids. Nothing here writes.
function typeIdsOf(view){ return (view&&view.type_ids&&view.type_ids.length)
  ? view.type_ids : liveTypes().filter(t=>t.name==='child').map(t=>t.id); }

function childrenOf(nodeId,typeIds){                 // edges child->parent
  return liveEdges().filter(d=>d.to_id===nodeId&&typeIds.includes(d.type_id))
    .map(d=>getEntry(d.from_id)).filter(Boolean); }
function parentEdgesOf(id){                          // all outgoing typed links
  return liveEdges().filter(d=>d.from_id===id)
    .map(d=>({edge:d,node:getEntry(d.to_id),type:getType(d.type_id)}))
    .filter(x=>x.node&&x.type); }
function parentsOf(id,typeIds){
  return parentEdgesOf(id).filter(x=>typeIds.includes(x.edge.type_id)).map(x=>x.node); }
function backlinksOf(id){
  return liveEdges().filter(d=>d.to_id===id)
    .map(d=>({edge:d,node:getEntry(d.from_id),type:getType(d.type_id)}))
    .filter(x=>x.node&&x.type); }

function descendantSet(rootId,typeIds){              // excludes the root
  const out=new Set(),stack=[rootId];
  while(stack.length){ const cur=stack.pop();
    childrenOf(cur,typeIds).forEach(c=>{ if(!out.has(c.id)){out.add(c.id);stack.push(c.id);} }); }
  return out; }

// A view's matches: live entries that are descendants of EVERY condition
// (pure conjunction). No conditions = everything.
function viewMatches(view){
  const typeIds=typeIdsOf(view);
  const live=DB.entries.filter(e=>!e.deleted);
  if(!view||!view.cond_ids||!view.cond_ids.length) return new Set(live.map(e=>e.id));
  const sets=view.cond_ids.map(c=>descendantSet(c,typeIds));
  const out=new Set();
  live.forEach(e=>{ if(sets.every(s=>s.has(e.id))) out.add(e.id); });
  return out; }

// Tree structure within a match set: roots = matches with no matched
// parent; children restricted to matches. Downward-closed for ancestor
// conditions, so the tree is complete. Cycle-safe via render depth cap.
function matchedParents(id,matched,typeIds){
  return parentsOf(id,typeIds).filter(p=>matched.has(p.id)); }
function treeRoots(matched,typeIds){
  const roots=[];
  matched.forEach(id=>{ const e=getEntry(id); if(!e)return;
    if(!matchedParents(id,matched,typeIds).length) roots.push(e); });
  return roots.sort((a,b)=>b.ts.localeCompare(a.ts)); }
function matchedChildren(id,matched,typeIds){
  return childrenOf(id,typeIds).filter(c=>matched.has(c.id))
    .sort((a,b)=>a.created_at.localeCompare(b.created_at)); }   // stable sibling order

// Canonical path (for flat date-sorted lists): shortest ancestor chain
// within the match set, BFS upward, parents ordered by edge age.
function canonicalPath(id,matched,typeIds){
  const pred={},q=[id],seen=new Set([id]); let top=null;
  while(q.length){ const cur=q.shift();
    const ps=matchedParents(cur,matched,typeIds);
    if(!ps.length){ top=cur; break; }
    for(const p of ps){ if(!seen.has(p.id)){ seen.add(p.id); pred[p.id]=cur; q.push(p.id); } } }
  if(top===null||top===id) return [];
  const path=[]; let cur=top;
  while(cur!==id&&cur!==undefined){ path.push(getEntry(cur)); cur=pred[cur]; }
  return path.filter(Boolean); }

// Search within a view: fuzzy over title (or first line for untitled),
// ranked by score, titledness, inbound links, recency of being linked.
function inboundCount(id){ return liveEdges().filter(d=>d.to_id===id).length; }
function lastLinkedAt(id){ let t='';
  liveEdges().forEach(d=>{ if(d.to_id===id&&d.created_at>t)t=d.created_at; }); return t; }
function searchInView(q,view){
  const matched=viewMatches(view);
  return DB.entries.filter(e=>!e.deleted&&matched.has(e.id))
    .map(e=>({e,sc:fuzzy(q,e.title?e.title:(e.body||''))}))
    .filter(x=>x.sc>=0)
    .sort((a,b)=>(b.sc-a.sc)||((b.e.title?1:0)-(a.e.title?1:0))
      ||(inboundCount(b.e.id)-inboundCount(a.e.id))
      ||lastLinkedAt(b.e.id).localeCompare(lastLinkedAt(a.e.id))); }

// Running intervals for an interval tab: current containment-children
// of its root. Ending one moves it out of the root; its start remains
// queryable forever via the ends edge.
function runningFor(tab){ const c=tab.cfg;
  if(!c.root_id||!getEntry(c.root_id)) return [];
  return childrenOf(c.root_id,[c.link_type_id])
    .sort((a,b)=>a.ts.localeCompare(b.ts)); }
function endEntryOf(startId,endTypeId){
  const d=liveEdges().find(x=>x.to_id===startId&&x.type_id===endTypeId);
  return d?getEntry(d.from_id):null; }
// ==== SEC:APP/QUERY (END) ====

// ==== SEC:APP/EXPORT (BEGIN) ====
// NDJSON, one typed object per line. Lossless over all five tables.
// serialize()/parseNDJSON() are shared by file export/import AND Drive
// sync — one wire format everywhere.
function serialize(){
  const L=[JSON.stringify({_t:'meta',v:2,exported:nowISO(),
    realm:Sync.st.realm||null,   // lets pull() refuse cross-realm merges
    settings:{allViewId:DB.settings.allViewId,mem:DB.settings.mem}})];
  const dump=(arr,t)=>arr.forEach(o=>L.push(JSON.stringify({_t:t,...o})));
  dump(DB.entries,'entry'); dump(DB.edges,'edge'); dump(DB.linkTypes,'linktype');
  dump(DB.views,'view'); dump(DB.tabs,'tab');
  return L.join('\n'); }
function parseNDJSON(text){
  const nd={v:2,realm:null,entries:[],edges:[],linkTypes:[],views:[],tabs:[],
    settings:{allViewId:null,mem:{},migratedV1:true,idsMigrated:true,dirty:true}};
  for(const line of text.split('\n')){ if(!line.trim())continue;
    let o; try{o=JSON.parse(line);}catch(e){return null;}
    const t=o._t; delete o._t;
    if(t==='meta'){ nd.realm=(typeof o.realm==='string'&&o.realm)?o.realm:null;
      if(o.settings){ nd.settings.allViewId=o.settings.allViewId??null;
        nd.settings.mem=o.settings.mem||{}; } }
    else if(t==='entry')nd.entries.push(o); else if(t==='edge')nd.edges.push(o);
    else if(t==='linktype')nd.linkTypes.push(o); else if(t==='view')nd.views.push(o);
    else if(t==='tab')nd.tabs.push(o); }
  nd.legacyIds=nd.entries.some(e=>typeof e.id==='number');
  return nd; }
function exportNDJSON(){
  const blob=new Blob([serialize()],{type:'application/x-ndjson'});
  const a=el('a'); a.href=URL.createObjectURL(blob);
  a.download='articulate-'+new Date().toISOString().slice(0,10)+'.ndjson';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Exported '+DB.entries.length+' entries'); }
function importText(text,mode){        // mode: 'merge' | 'replace'
  const nd=parseNDJSON(text);
  if(!nd){ toast('Import failed: bad file'); return; }
  if(mode==='merge'){
    if(nd.legacyIds){ toast('File uses legacy numeric ids — use Import & replace'); return; }
    mergeDB(nd); UI.rerender(); toast('Merged'); }
  else {
    if(!confirm('Replace current data ('+DB.entries.length+' entries) with import ('+nd.entries.length+' entries)?'))return;
    if(nd.legacyIds) nd.settings.idsMigrated=false;
    DB=nd; if(!DB.settings.idsMigrated) migrateIds();
    initCounters(); UI.tabId=liveTabs()[0]?.id;
    saveNow(); UI.rerender(); toast('Imported'); } }
// Everything a factory reset needs on the local side: drop the store,
// rebuild the seed, refresh the UI. Realm membership is the caller's
// concern (SEC:APP/SYNC).
function resetLocalStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  DB={ v:2, entries:[],edges:[],linkTypes:[],views:[],tabs:[],
    settings:{allViewId:null,mem:{},migratedV1:true,idsMigrated:true,dirty:false} };
  initCounters(); seed();
  UI.tabId=liveTabs()[0]?.id; UI.rerender(); }
// True if any record was created outside seed() — i.e. there is
// something worth snapshotting before a reset.
function hasNonSeedData(){
  return ['entries','edges','linkTypes','views','tabs']
    .some(t=>DB[t].some(r=>!String(r.id).startsWith('seed-'))); }
// ==== SEC:APP/EXPORT (END) ====

// ==== SEC:APP/MERGE (BEGIN) ====
// Multi-device merge. Rule: union by id per table; where both sides
// have a record, the newer updated_at wins whole-record (created_at as
// fallback clock). Deletes are just records whose tombstone flag rode
// in on a newer clock, so delete-vs-edit resolves by the same rule.
// Order-insensitive and idempotent: any stale file merges harmlessly.
// Seed records carry the same fixed ids everywhere (SEC:APP/SEED), so
// independently seeded stores union into one seed by construction.
const stampOf=r=>r.updated_at||r.created_at||'';
function mergeDB(nd){
  if(!DB.settings.mem) DB.settings.mem={};
  ['entries','edges','linkTypes','views','tabs'].forEach(t=>{
    const local=new Map(DB[t].map(r=>[r.id,r]));
    (nd[t]||[]).forEach(r=>{
      const l=local.get(r.id);
      if(!l) DB[t].push(r);
      else if(stampOf(r)>stampOf(l)) Object.assign(l,r); }); });
  if(!getView(DB.settings.allViewId)&&nd.settings&&getView(nd.settings.allViewId))
    DB.settings.allViewId=nd.settings.allViewId;
  Object.entries((nd.settings&&nd.settings.mem)||{}).forEach(([k,v])=>{
    if(!(k in DB.settings.mem)) DB.settings.mem[k]=v; });   // local field memory wins
  DB.settings.dirty=true;
  if(UI.tabId&&UI.tabId!=='menu'&&!getTab(UI.tabId)) UI.tabId=liveTabs()[0]?.id||null;
  saveNow({schedule:false}); } // SEC:APP/MERGE: sync-internal writes must not queue another sync
// ==== SEC:APP/MERGE (END) ====

// ==== SEC:APP/SYNC (BEGIN) ====
// Google Drive sync, organized around REALMS.
//
// A realm is one shared dataset, named by a short random string. Its
// state lives in a single Drive file, capturelog-sync-<realm>.ndjson,
// maintained by convergent pull-merge-push cycles (SEC:APP/MERGE). A
// well-known pointer file, capturelog-realm.json, records which realm
// this Drive account is currently on: {realm, generation}. generation
// is a monotonic counter, bumped each time a realm is minted.
//
// Every sync cycle begins by reading the pointer:
//  - pointer generation ABOVE this device's: the dataset was reset
//    from another device. This device's store is preserved to Drive
//    as a restorable snapshot (if it holds any non-seed data), then
//    wiped and re-seeded, and the device joins the pointer's realm.
//  - pointer generation BELOW this device's: the pointer is stale
//    (written by a device that hadn't caught up); rewrite it.
//  - equal generations, different realms (two devices minted
//    concurrently): the lexicographically greater realm string wins —
//    the same verdict on every device, so all converge.
//  - no pointer: publish this device's realm (minting one if needed).
// A device that has data but no realm yet (used offline before its
// first sync) joins the pointer's realm WITHOUT a wipe; the ordinary
// merge unions its records in.
//
// The reset story follows from the pointer: "New realm" (⋯ menu)
// mints a fresh realm at generation+1, wipes this device, and
// rewrites the pointer; every other device follows on its own next
// sync. Restoring a snapshot mints a new realm the same way, seeded
// with the snapshot's contents. Files of realms nobody points at —
// including files written by app builds that know nothing of realms —
// are simply never read again; they can be deleted from Drive by hand
// at leisure.
//
// Transport is client-only: Google Identity Services for an access
// token (drive.file scope — the app can only see files it created),
// Drive REST v3 for the blobs.
// Auth rules:
//  - Tokens are requested ONLY from a user tap. GIS token requests
//    open a (possibly self-closing) popup; non-gesture attempts get
//    popup-blocked and some failure paths never call back.
//  - The granted token (~1h) is cached in localStorage, so page loads
//    and background syncs within its lifetime need no GIS at all.
//  - The token client is created fresh per request with callback AND
//    error_callback in its config (property assignment after init is
//    not reliably honored), wrapped in a hard timeout so the busy
//    flag can never deadlock.
//  - Setup is an in-app modal, not window.prompt(), which is a no-op
//    in iOS home-screen (standalone) mode.
// The OAuth client ID is a public identifier (security lives in the
// authorized-origins list and the consent screen, not in hiding the
// id), so it is safe to commit here. Paste yours to make every device
// configured out of the box; the settings sheet can still override it
// per device.
const DEFAULT_CLIENT_ID='305277477211-dfb7fhhoe8mndv217sspkru5eu6k7e9s.apps.googleusercontent.com';
const REALM_POINTER_NAME='capturelog-realm.json';
const Sync={
  CFG:'capturelog.sync',
  st:{clientId:null,realm:null,generation:0,ptrId:null,fileId:null,remoteTime:null,token:null,tokenExp:0},
  gisLoading:null, status:'off', busy:false, pushTimer:null, lastPullDecision:'none',
  clientId(){ return this.st.clientId||DEFAULT_CLIENT_ID||null; },
  loadCfg(){ try{ const r=localStorage.getItem(this.CFG);
    if(r)Object.assign(this.st,JSON.parse(r)); }catch(e){} },
  saveCfg(){ try{ localStorage.setItem(this.CFG,JSON.stringify(this.st)); }catch(e){} },
  configured(){ return !!this.clientId(); },
  tokenValid(){ return this.st.token&&Date.now()<this.st.tokenExp; },
  tokenStateLabel(){
    if(!this.st.token) return 'missing';
    return this.tokenValid()?'valid':'expired'; },
  newRealmId(){

// Shared collapsible entry tree: view-filtered, search-pruned, stable
// sibling order, per-context expand set, ⇊ recursive expand, and the
// per-row ＋ that creates the typed search text as a child of that row.
// opts: {view, q, expand:Set, onPick(e), extras(e)->[nodes], addType}
function renderTree(container,opts){
  const view=opts.view, typeIds=typeIdsOf(view);
  const matched=viewMatches(view);
  const q=(opts.q||'').trim();
  let include=matched, hits=null;
  if(q){ hits=new Set();
    matched.forEach(id=>{ const e=getEntry(id);
      if(e&&fuzzy(q,e.title?e.title:(e.body||''))>=0) hits.add(id); });
    include=new Set(hits);
    hits.forEach(id=>{                            // pull in ancestors of hits
      const stack=[id],seen=new Set([id]);
      while(stack.length){ const cur=stack.pop();
        matchedParents(cur,matched,typeIds).forEach(p=>{
          if(!seen.has(p.id)){ seen.add(p.id); include.add(p.id); stack.push(p.id); } }); } }); }

  const roots=treeRoots(include,typeIds);
  if(!roots.length){ container.appendChild(el('div','empty',
    q?'No matches. Tap ＋ on a row to create “'+q+'” there.':'Nothing here yet.')); return; }

  const draw=(e,depth,seen)=>{
    if(seen.has(e.id)||depth>12) return;          // DAG/cycle guard
    seen.add(e.id);
    const kids=matchedChildren(e.id,include,typeIds);
    const open=q? true : opts.expand.has(e.id);   // search auto-expands
    const row=el('div','trow'); row.style.paddingLeft=(6+depth*18)+'px';
    const chev=el('button','chev',kids.length?(open?'▾':'▸'):'·');
    if(kids.length) chev.addEventListener('click',ev=>{ ev.stopPropagation();
      open?opts.expand.delete(e.id):opts.expand.add(e.id); opts.refresh(); });
    row.appendChild(chev);
    if(kids.length&&!open){ const dd=el('button','tbtn','⇊'); dd.title='Expand all';
      dd.addEventListener('click',ev=>{ ev.stopPropagation();
        const st=[e.id]; while(st.length){ const c=st.pop(); opts.expand.add(c);
          matchedChildren(c,include,typeIds).forEach(k=>st.push(k.id)); }
        opts.refresh(); });
      row.appendChild(dd); }
    const nm=el('button','nm'+(e.title?'':' untitled')+((hits&&hits.has(e.id))?' hit':''),disp(e));
    nm.style.textAlign='left';
    nm.addEventListener('click',()=>opts.onPick(e));
    row.appendChild(nm);
    if(kids.length) row.appendChild(el('span','cnt',String(kids.length)));
    if(q){ const add=el('button','tbtn add','＋'); add.title='Create “'+q+'” under this';
      add.addEventListener('click',ev=>{ ev.stopPropagation();
        const n=createEntry({title:q});
        addEdge(n.id,e.id,opts.addType||typeIds[0]);
        toast('Created under '+disp(e)); opts.refresh(); });
      row.appendChild(add); }
    if(opts.extras) opts.extras(e).forEach(x=>row.appendChild(x));
    container.appendChild(row);
    if(open) kids.forEach(k=>draw(k,depth+1,seen));
    seen.delete(e.id);
  };
  roots.forEach(r=>draw(r,0,new Set()));
}

      typeLabel:type.name,
      onTypeTap:()=>pickType(t=>{retypeEdge(edge.id,t.id);
        DB.settings.mem[fieldKey+'.type']=t.id; save(); afterChange();}),
      onRemove:()=>{removeEdge(edge.id);afterChange();},
      onTap:()=>openEditor(node.id)})); });
  const add=el('button','chip add','⌕ link…');
  add.addEventListener('click',()=>{
    pickEntry(fieldKey,e=>{
      const tKey=fieldKey+'.type';
      const remembered=getType(DB.settings.mem[tKey]);
      const tid=(remembered||liveTypes().find(t=>t.name==='child')||liveTypes()[0]).id;
      addEdge(entryId,e.id,tid); afterChange(); }); });
  wrap.appendChild(add);
  container.appendChild(wrap); }
// The entry top row shared by the create tab and the editor: timestamp,
// title, and ＋. ＋ creates a new child entry and opens its editor as a
// stacked sheet whose offset keeps this row visible; each further ＋
// stacks and offsets again.
// Tap-to-edit timestamp: label per the display rules (time only when
// today; otherwise date over time, compactly stacked), with a hidden
// native input whose picker DIALOG is launched on tap via showPicker().
function tsField(e){
  const box=el('div','tsbtn');
  const lbl=el('span','tslbl'); box.appendChild(lbl);
  const paint=()=>{ lbl.innerHTML='';
    const x=fmtDTParts((getEntry(e.id)||e).ts);
    if(x.date) lbl.appendChild(el('span','d',x.date));
    lbl.appendChild(el('span','t',x.time)); };
  paint();
  const inp=el('input','tsnative'); inp.type='datetime-local';
  inp.setAttribute('tabindex','-1'); inp.setAttribute('aria-hidden','true');
  inp.addEventListener('change',()=>{ const iso=fromLocalInput(inp.value);
    if(iso){ updateEntry(e.id,{ts:iso}); paint(); } });
  box.appendChild(inp);
  box.setAttribute('role','button');
  box.setAttribute('aria-label','Edit timestamp');
  box.addEventListener('click',()=>{
    inp.value=toLocalInput((getEntry(e.id)||e).ts);
    try{ inp.showPicker ? inp.showPicker() : inp.focus(); }
    catch(err){ inp.focus(); } });
  return box; }
function entryTopRow(e){
  const top=el('div','f-toprow');
  top.appendChild(tsField(e));
  const title=el('input','f-title'); title.placeholder='Title'; title.value=e.title||'';
  title.addEventListener('input',()=>updateEntry(e.id,{title:title.value.trim()||null}));
  top.appendChild(title);
  const add=el('button','tbtn-add','＋'); add.title='New entry under this one';
  add.addEventListener('click',()=>{
    const n=createEntry();
    addEdge(n.id,e.id,(liveTypes().find(t=>t.name==='child')||liveTypes()[0]).id);
    openEditor(n.id); });
  top.appendChild(add);
  return top; }
// ==== SEC:APP/UI/CHIPS (END) ====

// ==== SEC:APP/UI/TAB_CREATE (BEGIN) ====
// "＋": selecting the tab — whether arriving from another tab or
// re-tapping the active one — always presents a NEW entry; the tab
// gesture is the only "new entry" control, there is no button. An
// untouched draft (no title, no body) is reused with its timestamp
// bumped to now, so idle visits don't strew empty entries; a draft with
// any content is left behind as a committed entry and a fresh one
// starts. Defaults from tab cfg are applied at birth. Edits stream
// straight into the row.
function freshenDraft(tab){
  const st=tabState(tab.id);
  const d=st.draftId?getEntry(st.draftId):null;
  if(d&&!d.deleted&&!d.title&&!d.body) updateEntry(d.id,{ts:nowISO()});
  else st.draftId=null; }
function ensureDraft(tab){
  const st=tabState(tab.id);
  if(st.draftId&&getEntry(st.draftId)) return getEntry(st.draftId);
  const d=tab.cfg.def||{};
  const e=createEntry({title:d.title||null,body:d.body||null});
  (d.links||[]).forEach(l=>{ if(getEntry(l.to))addEdge(e.id,l.to,l.type); });
  st.draftId=e.id; return e; }

function renderCreate(v,tab){
  const e=ensureDraft(tab);
  v.appendChild(entryTopRow(e));

  const body=el('textarea','f-body'); body.value=e.body||'';
  body.addEventListener('input',()=>updateEntry(e.id,{body:body.value||null}));
  v.appendChild(body);

  v.appendChild(el('div','f-lbl','Links'));
  const lf=el('div'); v.appendChild(lf);
  linksField(lf,e.id,'tab'+tab.id+'.links',()=>UI.rerender());
  setTimeout(()=>body.focus(),40);
}
// ==== SEC:APP/UI/TAB_CREATE (END) ====

// ==== SEC:APP/UI/TAB_INTERVAL (BEGIN) ====
// "🕓": root picker at top; below, every current child of the root is a
// running interval with an "end now" button. Ending creates the end
// entry, links it (ends-type) to the start, and unlinks the start from
// the root. ＋ starts a new interval and opens its editor.
function renderInterval(v,tab){
  const c=tab.cfg;
  v.appendChild(el('div','f-lbl','Root'));
  const root=c.root_id?getEntry(c.root_id):null;
  const rf=el('button','f-field',root?disp(root):'root');
  rf.addEventListener('click',()=>pickEntry('tab'+tab.id+'.root',e=>{
    c.root_id=e.id; touch(tab); save(); UI.rerender(); }));
  v.appendChild(rf);
  if(!root){ v.appendChild(el('div','empty','Pick a root entry (e.g. “Intervals”). Its children are your running clocks.')); return; }

  v.appendChild(el('div','f-lbl','Running'));
  const running=runningFor(tab);
  if(!running.length) v.appendChild(el('div','empty','Nothing running.'));
  running.forEach(e=>{
    const row=el('div','trow');
    row.appendChild(el('span','chev','▶'));
    const nm=el('button','nm'+(e.title?'':' untitled'),disp(e)); nm.style.textAlign='left';
    nm.addEventListener('click',()=>openEditor(e.id));
    row.appendChild(nm);
    row.appendChild(el('span','cnt',fmtDur(Date.now()-new Date(e.ts))));
    const end=el('button','tbtn end','end now');
    end.addEventListener('click',()=>{
      const endE=createEntry();
      addEdge(endE.id,e.id,c.end_type_id);
      const rootEdge=liveEdges().find(d=>d.from_id===e.id&&d.to_id===c.root_id&&d.type_id===c.link_type_id);
      if(rootEdge)removeEdge(rootEdge.id);
      toast('Ended · '+fmtDur(Date.now()-new Date(e.ts)));
      UI.rerender(); });
    row.appendChild(end);
    v.appendChild(row); });

  const nb=el('button','bigbtn go','＋ Start an interval');
  nb.addEventListener('click',()=>{
    const e=createEntry(); addEdge(e.id,c.root_id,c.link_type_id);
    UI.rerender(); openEditor(e.id); });
  v.appendChild(nb);
}
// ==== SEC:APP/UI/TAB_INTERVAL (END) ====

// ==== SEC:APP/UI/TAB_EXPLORE (BEGIN) ====
// "🧭": view field at top, then the entry tree (or a flat date-sorted
// list with canonical paths). Tapping an entry opens its editor.
function viewField(container,fieldKey,fbId,onChange){
  const view=Mem.get(fieldKey,fbId);
  const f=el('button','f-field',view?('view: '+view.name):'view');
  f.addEventListener('click',()=>pickView(vw=>{Mem.set(fieldKey,vw.id);onChange();}));
  container.appendChild(f); return view; }

function renderExplore(v,tab){
  const st=tabState(tab.id); st.expand=st.expand||new Set();
  st.sort=st.sort==='ts'?'ts':'tree';
  const vrow=el('div','f-row'); vrow.style.flexWrap='nowrap';
  const view=viewField(vrow,'tab'+tab.id+'.view',tab.cfg.view_id,()=>UI.rerender());
  const sortBtn=el('button','sorttog',st.sort==='tree'?'tree':'by time');
  sortBtn.addEventListener('click',()=>{ st.sort=st.sort==='tree'?'ts':'tree'; UI.rerender(); });
  vrow.appendChild(sortBtn);
  v.appendChild(vrow);
  const q=el('input'); q.placeholder='Search'; q.style.cssText='width:100%;margin:10px 0;padding:9px 12px';
  q.value=st.q||''; q.addEventListener('input',()=>{st.q=q.value;redraw();});
  v.appendChild(q);
  const box=el('div'); v.appendChild(box);

  function redraw(){
    box.innerHTML='';
    if(st.sort==='tree'){
      renderTree(box,{view,q:st.q,expand:st.expand,refresh:redraw,
        onPick:e=>openEditor(e.id)});
    } else {
      const typeIds=typeIdsOf(view), matched=viewMatches(view);
      let list=[...matched].map(getEntry).filter(Boolean);
      if(st.q&&st.q.trim())
        list=list.filter(e=>fuzzy(st.q.trim(),e.title?e.title:(e.body||''))>=0);
      list.sort((a,b)=>b.ts.localeCompare(a.ts));
      if(!list.length){ box.appendChild(el('div','empty','No matches.')); return; }
      list.slice(0,300).forEach(e=>{
        const r=el('button','flatrow');
        const path=canonicalPath(e.id,matched,typeIds);
        const extra=matchedParents(e.id,matched,typeIds).length-1;
        if(path.length) r.appendChild(el('div','path',
          path.map(disp).join(' / ')+(extra>0?'  ·  +'+extra:'')));
        const line=el('div','line');
        line.appendChild(el('span','nm'+(e.title?'':' untitled'),disp(e)));
        line.appendChild(el('span','tm',fmtDT(e.ts)));
        r.appendChild(line);
        r.addEventListener('click',()=>openEditor(e.id));
        box.appendChild(r); });
    }
  }
  redraw();
}
// ==== SEC:APP/UI/TAB_EXPLORE (END) ====

// ==== SEC:APP/UI/TAB_EXCL (BEGIN) ====

function renderExclusive(v,tab){

    renderTree(box,{view,q:st.q,expand:st.expand,refresh:redraw,
      onPick:e=>openExclusivePanel(e.id,tab)}); }

// "🕮": rename, reorder, duplicate (workflow tabs only), delete, and
// open per-class configuration. Engine tabs are fixed.
function renderTabs(v){
  const engine=['views','links','tabs'];
  liveTabs().forEach((t,i,arr)=>{
    const r=el('div','cfg-row');
    const lbl=el('input'); lbl.value=t.label; lbl.style.cssText='width:52px;text-align:center;padding:6px';
    lbl.addEventListener('change',()=>{t.label=lbl.value||'·';touch(t);save();renderTabbar();});
    r.appendChild(lbl);
    const nm=el('button','nm',t.cls); nm.style.textAlign='left';
    if(!engine.includes(t.cls)) nm.addEventListener('click',()=>openTabEditor(t.id));
    r.appendChild(nm);
    const up=el('button','mini','↑');
    up.addEventListener('click',()=>{ const vis=liveTabs(); const idx=vis.indexOf(t);
      if(idx>0){ const p=vis[idx-1];

        touch(t); touch(p); save(); UI.rerender(); } });

      const dup=el('button','mini','⧉'); dup.title='Duplicate';

        toast('Duplicated — its field memories start fresh'); UI.rerender(); });
      r.appendChild(dup);
      const del=el('button','mini','✕');
      del.addEventListener('click',()=>{ if(confirm('Delete this tab? (Data is untouched.)')){
        t.deleted=1; touch(t); save(); if(UI.tabId===t.id)UI.tabId=liveTabs()[0].id; UI.rerender(); } });
      r.appendChild(del);

// ==== SEC:APP/UI/EDITOR (BEGIN) ====
// The entry editor: same anatomy as the create tab, plus backlinks and
// delete. ＋ in the top row births a child and stacks its editor.
function openEditor(entryId){
  Modal.push((m,body)=>{
    const e=getEntry(entryId);
    if(!e){ body.appendChild(el('div','empty','Entry was deleted.')); return; }
    body.appendChild(entryTopRow(e));
    const bd=el('textarea','f-body short'); bd.placeholder='Body'; bd.value=e.body||'';
    bd.addEventListener('input',()=>updateEntry(e.id,{body:bd.value||null}));
    body.appendChild(bd);

    body.appendChild(el('div','f-lbl','Links'));
    const lf=el('div'); body.appendChild(lf);
    linksField(lf,e.id,'editor.links',()=>Modal.refresh());

    const bl=backlinksOf(e.id);
    if(bl.length){
      body.appendChild(el('div','f-lbl','Linked from ('+bl.length+')'));
      const row=el('div','chiprow');
      bl.slice(0,20).forEach(({node,type})=>
        row.appendChild(entryChip(node,{typeLabel:type.name,onTap:()=>openEditor(node.id)})));
      body.appendChild(row); }

    const del=el('button','dangerbtn','Delete entry');
    del.addEventListener('click',()=>{ if(confirm('Delete this entry? (soft delete; links detach)')){
      deleteEntry(e.id); Modal.pop(); } });
    body.appendChild(del);
  });
}

// ==== SEC:APP/UI/PICK_ENTRY (BEGIN) ====
// The entry picker: search box + view chip up top, the shared tree
// below. Tapping a name picks it; ＋ on a row creates the typed text as
// that row's child (list refreshes, nothing is picked). The view chosen
// here is remembered per fieldKey.
function pickEntry(fieldKey,onPick){
  const state={q:'',expand:new Set()};
  Modal.push((m,body)=>{
    const top=el('div','mtop');
    const q=el('input'); q.placeholder='Search or type a new title…';
    q.addEventListener('input',()=>{state.q=q.value;draw();});
    top.appendChild(q);
    const cancel=el('button','cancel','Cancel');
    cancel.addEventListener('click',()=>Modal.pop());
    top.appendChild(cancel);
    m.insertBefore(top,body);

    const vrow=el('div'); vrow.style.cssText='padding:0 0 8px';
    body.appendChild(vrow);
    const box=el('div'); body.appendChild(box);

    function draw(){
      vrow.innerHTML=''; box.innerHTML='';
      const view=Mem.get(fieldKey,DB.settings.allViewId);
      const vchip=el('button','chip','view: '+view.name);
      vchip.addEventListener('click',()=>pickView(vw=>{Mem.set(fieldKey,vw.id);draw();}));
      vrow.appendChild(vchip);
      renderTree(box,{view,q:state.q,expand:state.expand,refresh:draw,
        onPick:e=>{ Modal.pop(); onPick(e); }});
    }
    draw();
    setTimeout(()=>q.focus(),60);
  });
}
// ==== SEC:APP/UI/PICK_ENTRY (END) ====

// ==== SEC:APP/UI/PANEL_EXCL (BEGIN) ====
// The swap panel: entry's title/body read-only up top; swap-view field;
// members as chips with current membership filled. Tapping a member
// removes this entry's links (of the tab's type) to ALL current members
// of the swap view, then links the tapped one — self-healing exclusivity.
function openExclusivePanel(entryId,tab){
  Modal.push((m,body)=>{
    const e=getEntry(entryId);
    if(!e){ body.appendChild(el('div','empty','Entry was deleted.')); return; }
    body.appendChild(el('div','f-lbl','Entry'));
    const nm=el('button',null,disp(e));
    nm.style.cssText='font-size:18px;font-weight:600;text-align:left;padding:2px 0';
    nm.addEventListener('click',()=>openEditor(e.id));
    body.appendChild(nm);
    if(e.title&&e.body){ const b=el('div',null,e.body.slice(0,200));
      b.style.cssText='color:var(--muted);font-size:14px;margin-top:4px'; body.appendChild(b); }

    body.appendChild(el('div','f-lbl','Set (exactly one)'));
    const fieldKey='tab'+tab.id+'.swap';
    const vrow=el('div'); body.appendChild(vrow);
    const crow=el('div','chiprow'); crow.style.marginTop='10px'; body.appendChild(crow);

    function draw(){
      vrow.innerHTML=''; crow.innerHTML='';
      const swapView=Mem.get(fieldKey,tab.cfg.swap_view_id);
      const vchip=el('button','chip','view: '+swapView.name);
      vchip.addEventListener('click',()=>pickView(vw=>{Mem.set(fieldKey,vw.id);draw();}));
      vrow.appendChild(vchip);

      const members=[...viewMatches(swapView)].map(getEntry).filter(Boolean)
        .sort((a,b)=>a.created_at.localeCompare(b.created_at));
      const currentIds=new Set(parentEdgesOf(e.id)
        .filter(x=>x.edge.type_id===tab.cfg.link_type_id).map(x=>x.node.id));
      members.forEach(mem=>{
        const isCur=currentIds.has(mem.id);
        const ch=entryChip(mem,{cls:isCur?'sel':'',onTap:()=>{
          parentEdgesOf(e.id).forEach(x=>{
            if(x.edge.type_id===tab.cfg.link_type_id&&members.some(mm=>mm.id===x.node.id))
              removeEdge(x.edge.id); });
          addEdge(e.id,mem.id,tab.cfg.link_type_id);
          toast(disp(e)+' → '+disp(mem)); draw(); }});
        crow.appendChild(ch); });
      if(!members.length) crow.appendChild(el('div','empty','The swap view matches nothing.'));
    }
    draw();
  });
}
// ==== SEC:APP/UI/PANEL_EXCL (END) ====

// ==== SEC:APP/UI/EDIT_VIEW (BEGIN) ====
// name, ancestor conditions (+/×, ANDed), containment link types.
function openViewEditor(viewId){
  Modal.push((m,body)=>{
    const vw=getView(viewId);
    if(!vw){ body.appendChild(el('div','empty','View was deleted.')); return; }
    body.appendChild(el('div','f-lbl','View name'));
    const nm=el('input','f-title'); nm.value=vw.name;
    nm.addEventListener('input',()=>{vw.name=nm.value||'view';touch(vw);save();});
    body.appendChild(nm);

    body.appendChild(el('div','f-lbl','Conditions — entry must descend from ALL of:'));
    const crow=el('div','chiprow'); body.appendChild(crow);
    function drawConds(){
      crow.innerHTML='';
      vw.cond_ids=vw.cond_ids.filter(id=>getEntry(id));      // self-repair danglers
      vw.cond_ids.forEach(cid=>{
        crow.appendChild(entryChip(getEntry(cid),{onRemove:()=>{
          vw.cond_ids=vw.cond_ids.filter(x=>x!==cid); touch(vw); save(); drawConds(); }})); });
      const add=el('button','chip add','＋ condition');
      add.addEventListener('click',()=>pickEntry('viewEditor.cond',e=>{
        if(!vw.cond_ids.includes(e.id))vw.cond_ids.push(e.id); touch(vw); save(); drawConds(); }));
      crow.appendChild(add);
      if(!vw.cond_ids.length) crow.appendChild(el('span','f-created','(none — matches everything)'));
    }
    drawConds();

    body.appendChild(el('div','f-lbl','Containment link types'));
    const trow=el('div','chiprow'); body.appendChild(trow);
    liveTypes().forEach(t=>{
      const on=vw.type_ids.includes(t.id);
      const c=el('button','chip'+(on?' sel':''),t.name);
      c.addEventListener('click',()=>{
        vw.type_ids=on?vw.type_ids.filter(x=>x!==t.id):[...vw.type_ids,t.id];
        touch(vw); save(); Modal.refresh(); });
      trow.appendChild(c); });

    if(!vw.locked){
      const del=el('button','dangerbtn','Delete view');
      del.addEventListener('click',()=>{ if(confirm('Delete view “'+vw.name+'”?')){
        vw.deleted=1; touch(vw); save(); Modal.pop(); } });
      body.appendChild(del); }
  });
}
// ==== SEC:APP/UI/EDIT_VIEW (END) ====

// ==== SEC:APP/UI/EDIT_TAB (BEGIN) ====
// Per-class configuration for workflow tabs.
function openTabEditor(tabId){
  Modal.push((m,body)=>{
    const t=getTab(tabId);
    if(!t){ body.appendChild(el('div','empty','Tab was deleted.')); return; }
    body.appendChild(el('div','f-lbl',t.cls+' tab — label'));
    const lbl=el('input','f-title'); lbl.value=t.label;
    lbl.addEventListener('input',()=>{t.label=lbl.value||'·';touch(t);save();renderTabbar();});
    body.appendChild(lbl);
    const c=t.cfg;

    const entryField=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getEntry(c[key]):null;
      const f=el('button','f-field',cur?disp(cur):'pick…');
      f.addEventListener('click',()=>pickEntry('tabEditor.'+key,e=>{
        c[key]=e.id; touch(t); save(); Modal.refresh(); }));
      body.appendChild(f); };
    const viewFieldCfg=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getView(c[key]):null;
      const f=el('button','f-field',cur?cur.name:'pick…');
      f.addEventListener('click',()=>pickView(vw=>{c[key]=vw.id;touch(t);save();Modal.refresh();}));
      body.appendChild(f); };
    const typeFieldCfg=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getType(c[key]):null;
      const f=el('button','f-field',cur?cur.name:'pick…');
      f.addEventListener('click',()=>pickType(tp=>{c[key]=tp.id;touch(t);save();Modal.refresh();}));
      body.appendChild(f); };

    if(t.cls==='create'){
      c.def=c.def||{};
      body.appendChild(el('div','f-lbl','Default title'));
      const dt=el('input','f-title'); dt.value=c.def.title||'';
      dt.addEventListener('input',()=>{c.def.title=dt.value||null;touch(t);save();});
      body.appendChild(dt);
      body.appendChild(el('div','f-lbl','Default body'));
      const db=el('textarea','f-body short'); db.value=c.def.body||'';
      db.addEventListener('input',()=>{c.def.body=db.value||null;touch(t);save();});
      body.appendChild(db);
      body.appendChild(el('div','f-lbl','Default links'));
      const lr=el('div','chiprow'); body.appendChild(lr);
      function drawDef(){
        lr.innerHTML=''; c.def.links=(c.def.links||[]).filter(l=>getEntry(l.to));
        c.def.links.forEach((l,i)=>{
          lr.appendChild(entryChip(getEntry(l.to),{typeLabel:getType(l.type)?.name,
            onRemove:()=>{c.def.links.splice(i,1);touch(t);save();drawDef();}})); });
        const add=el('button','chip add','＋');
        add.addEventListener('click',()=>pickEntry('tabEditor.deflink',e=>{
          c.def.links.push({to:e.id,type:liveTypes().find(x=>x.name==='child').id});
          touch(t); save(); drawDef(); }));
        lr.appendChild(add); }
      drawDef();
    }
    else if(t.cls==='interval'){
      entryField('Root entry','root_id');
      typeFieldCfg('Attach link type','link_type_id');
      typeFieldCfg('End link type','end_type_id');
    }
    else if(t.cls==='explore'){ viewFieldCfg('Default view','view_id'); }
    else if(t.cls==='exclusive'){
      viewFieldCfg('List view','list_view_id');
      viewFieldCfg('Swap view','swap_view_id');
      typeFieldCfg('Link type','link_type_id');
    }
  });
}
// ==== SEC:APP/UI/EDIT_TAB (END) ====

// ==== SEC:APP/UI/MENU (BEGIN) ====
// "⋯": sync, portability and reset actions live on their own tab. The
// tab itself is synthetic (renderTabbar appends it after the data
// tabs), so it exists on every device regardless of DB contents.
function renderMenuTab(v){
  const status=(Store.memoryOnly?'Storage: MEMORY ONLY — export to keep data. ':'Storage: this browser. ')
    +DB.entries.filter(e=>!e.deleted).length+' entries, '
    +liveEdges().length+' links, '+liveViews().length+' views. '
    +(Sync.configured()
      ?('Drive: '+Sync.status
        +(Sync.st.realm?(' · '+Sync.st.realm+' g'+(Sync.st.generation||0)):'')+'.')
      :'Drive: not set up.');
  v.appendChild(el('div','f-created',status));
  const btn=(label,fn,cls)=>{ const b=el('button','bigbtn'+(cls?' '+cls:''),label);
    b.addEventListener('click',fn); v.appendChild(b); return b; };
  const syncLbl={off:'Set up Drive sync…','need-auth':'Drive: sign in',
    ok:'Sync now',error:'Sync now (retry)',syncing:'Syncing…'}[Sync.status]||'Drive sync';
  btn(syncLbl,()=>{ if(!Sync.configured())Sync.setup();
    else Sync.syncNow(true).then(()=>UI.rerender()); });
  if(Sync.configured()) btn('Drive settings…',()=>Sync.setup());
  btn('Sync diagnostics…',()=>Menu.diagnostics());
  btn('Snapshots / restore…',()=>Menu.snapshots());
  btn('Export NDJSON',()=>exportNDJSON());
  btn('Import & merge…',()=>{ importMode='merge'; $('#importfile').click(); });
  btn('Import & replace…',()=>{ importMode='replace'; $('#importfile').click(); });
  btn('Wipe local data…',()=>Menu.wipeLocal(),'danger');
  btn('New realm (reset all)…',()=>Sync.newRealm(),'danger');
}
const Menu={
  diagnostics(){
    const d=Sync.diagnostics();
    Modal.push((m,body)=>{
      body.appendChild(el('div','f-lbl','Sync diagnostics'));
      const rows=[
        ['deviceId',d.deviceId],
        ['sync configured',d.syncConfigured?'yes':'no'],
        ['token',d.token],
        ['realm',d.realm],
        ['generation',String(d.generation)],
        ['drive file id',d.fileId],
        ['remote modified',d.remoteModifiedTime],
        ['entries/edges',d.tableCounts.entries+' / '+d.tableCounts.edges],
        ['types/views/tabs',d.tableCounts.linkTypes+' / '+d.tableCounts.views+' / '+d.tableCounts.tabs]
      ];
      rows.forEach(([k,v])=>{
        const r=el('div','cfg-row');
        r.appendChild(el('span','nm',k));
        const vv=el('span','mt diag-val',v);
        r.appendChild(vv); body.appendChild(r); });
    });
  },
  snapshots(){
    Modal.push((m,body)=>{
      body.appendChild(el('div','f-lbl','Snapshots / restore'));
      body.appendChild(el('div','f-created',
        'Restoring replaces the data of every synced device with the snapshot: a new realm is minted from its contents, and each device follows on its next sync.'));
      if(Sync.st.realm)
        body.appendChild(el('div','f-created','Current realm: '+Sync.st.realm+' · generation '+(Sync.st.generation||0)));
      const box=el('div'); body.appendChild(box);
      const renderFiles=(files)=>{
        box.innerHTML='';
        if(!files.length){ box.appendChild(el('div','empty','No snapshots found.')); return; }
        files.forEach(f=>{
          const rawLabel=String(f.name||f.id||'snapshot').replace(/\s+/g,' ');
          const label=rawLabel.length>MAX_SNAPSHOT_LABEL_LENGTH
            ? rawLabel.slice(0,MAX_SNAPSHOT_LABEL_LENGTH-1)+'…'
            : rawLabel;
          const r=el('div','cfg-row');
          r.appendChild(el('span','nm',label));
          r.appendChild(el('span','mt',fmtDT(f.modifiedTime||nowISO())));
          const rs=el('button','mini','Restore');
          rs.addEventListener('click',()=>{
            if(!confirm('Restore snapshot "'+label+'" for ALL synced devices? Each device saves its own snapshot before following.')) return;
            Sync.restoreSnapshot(f).catch(()=>toast('Restore failed — try again')); });
          r.appendChild(rs);
          box.appendChild(r);
        });
      };
      const refresh=()=>{
        if(!Sync.configured()){ box.innerHTML=''; box.appendChild(el('div','empty','Set up Drive sync first.')); return; }
        Sync.ensureToken(true).then(()=>Sync.listSnapshots()).then(renderFiles)
          .catch(()=>toast('Could not load snapshots'));
      };
      const mk=el('button','bigbtn','Create snapshot now');
      mk.addEventListener('click',()=>{
        if(!Sync.configured()){ toast('Set up Drive sync first'); return; }
        Sync.ensureToken(true).then(()=>Sync.createSnapshot()).then(()=>{
          toast('Snapshot created'); refresh(); })
          .catch(()=>toast('Snapshot failed — try again')); });
      body.appendChild(mk);
      const rf=el('button','bigbtn','Refresh snapshot list');
      rf.addEventListener('click',refresh); body.appendChild(rf);
      refresh();
    });
  },
  // Device-only reset. Realm membership is kept, so the next sync pulls
  // the realm's data straight back — useful for exercising the join
  // path. A reset that sticks everywhere is Sync.newRealm().
  // Sync.st.remoteTime is cleared so pull()'s modifiedTime short-circuit
  // cannot skip the download and let a push overwrite the realm file
  // with the bare seed.
  wipeLocal(){
    const n=DB.entries.filter(e=>!e.deleted).length;
    if(!confirm('Wipe local data on this device? '+n+' entries plus all links, views and tabs are deleted and the app re-seeded. '
      +(Sync.configured()&&Sync.st.realm
        ?'The device stays in its realm, so the next sync restores the realm\u2019s data.'
        :'Google Drive is not touched.'))) return;
    if(!confirm('Last chance — consider Export NDJSON first. Wipe local data now?')) return;
    clearTimeout(Sync.pushTimer);                    // cancel any queued push of the old data
    Sync.st.remoteTime=null; Sync.saveCfg();
    resetLocalStore();
    toast(Sync.configured()&&Sync.st.realm
      ?'Local data wiped — next sync restores the realm'
      :'Local data wiped'); } };
let importMode='merge';
$('#importfile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>importText(r.result,importMode); r.readAsText(f);
  ev.target.value=''; });
// ==== SEC:APP/UI/MENU (END) ====

load();
migrateIds();        // numeric -> device-prefixed global ids (one-shot)
initCounters();      // per-device id counters, derived by scan
seed();              // no-op unless the DB is empty
migrateV1();         // one-shot import from the legacy store, if present
UI.tabId=liveTabs()[0]?.id;
UI.rerender();
Sync.init();         // silent Drive sync attempt if configured
// ==== SEC:APP/BOOT (END) ====

// ==== SEC:APP (END) ===================================================
</script>
