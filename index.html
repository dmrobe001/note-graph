// ==== SEC:APP/UI/EDIT_INTERVAL (BEGIN) ====
// The interval sheet — what tapping an interval opens (active rows on
// the 🕓 tab, interval rows in explore). Header: verb phrase, then
// active/concluded timing. Fields:
//   With — Person cloud, any number of `with` edges from the begin;
//   person chips with incoming `part of` / `of` links are expandable
//   along those links.
//   From / To — Place cloud, exactly-one by gesture; both are `at`
//   edges (From on the begin entry, To on the end entry). Offered
//   only when the interval's doing target `is a` Travel (found by
//   title); every other interval gets a single At field (`at` on the
//   begin entry) — one moment, one place. Selecting a To place with
//   no end entry yet PRE-CREATES it (begin -until-> end,
//   provisionally timestamped) to hold the planned destination; the
//   interval stays active until "end now" re-stamps it.
//   task done — shown when the interval's doing or object target is
//   a ghost: runs the fulfillment gesture from this interval's end
//   entry (concluding first if still active).
function openIntervalEditor(startId){
  Modal.push((m,body)=>{
    const e=getEntry(startId);
    if(!e){ body.appendChild(el('div','empty','Entry was deleted.')); return; }
    const endE=endEntryOf(e.id);
    const isActive=hasStatus(e.id,'active');

    body.appendChild(el('div','f-lbl','Interval'));
    const nm=el('button',null,intervalLabel(e));
    nm.style.cssText='font-size:18px;font-weight:600;text-align:left;padding:2px 0';
    nm.addEventListener('click',()=>openEditor(e.id));
    body.appendChild(nm);
    const when=el('div',null, isActive
      ? 'active · '+fmtDur(Date.now()-new Date(e.ts))+' · since '+fmtDT(e.ts)
      : endE
        ? fmtDT(e.ts)+' – '+fmtDT(endE.ts)+' · '+fmtDur(new Date(endE.ts)-new Date(e.ts))
        : fmtDT(e.ts));
    when.style.cssText='color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:2px';
    body.appendChild(when);

    // "end now" — the 🕓 tab's gesture, offered in the sheet too; the
    // sheet stays open and repaints as a concluded interval.
    if(isActive){
      const endBtn=el('button','bigbtn','end now');
      endBtn.addEventListener('click',()=>{
        concludeInterval(getEntry(e.id)); UI.rerender(); Modal.refresh(); });
      body.appendChild(endBtn); }

    const ensureEnd=()=>{
      const en=createEntry(); addEdge(e.id,en.id,untilTid());
      UI.rerender(); return en; };

    // A relation field: chips over an `is a` lexicon; selection = an
    // edge of typeId from opts.subject() — which may not exist yet
    // (To on a running interval), in which case opts.ensureSubject()
    // pre-creates the end entry. opts.expandTids makes chips with
    // incoming links of those types expandable.
    const relField=(label,typeId,rootKey,opts)=>{
      body.appendChild(el('div','f-lbl',label));
      const row=el('div','chiprow'); body.appendChild(row);
      const root=anchor(rootKey);
      const cur=()=>{ const s=opts.subject(); return s
        ? liveEdges().filter(g=>g.from_id===s.id&&g.type_id===typeId) : []; };
      const select=p=>{ const s=opts.subject()||opts.ensureSubject();
        if(opts.exclusive) cur().forEach(g=>removeEdge(g.id));
        addEdge(s.id,p.id,typeId); Modal.refresh(); };
      const cst=tabState('int-'+label+'-'+e.id);
      expandableCloud(row,cst,{
        top:()=>childrenOf(root.id,[isaTid()]),
        childTids:opts.expandTids||[],
        renderChip:(rw,p)=>{
          const sel=cur().some(g=>g.to_id===p.id);
          rw.appendChild(entryChip(p,{cls:sel?'sel':'',onTap:()=>{
            if(sel){ cur().forEach(g=>{ if(g.to_id===p.id) removeEdge(g.id); });
              Modal.refresh(); }
            else select(p); }})); },
        extras:(rw,rootId)=>{ if(rootId) return;
          const add=el('button','chip add','＋ new…');
          add.addEventListener('click',()=>{
            const t=prompt('New '+handle(root)+':');
            if(t&&t.trim()){ const n=createEntry({title:t.trim()});
              addEdge(n.id,root.id,isaTid()); select(n); } });
          rw.appendChild(add);
          if(!childrenOf(root.id,[isaTid()]).length&&!cur().length)
            rw.appendChild(el('span','empty slim','No '+handle(root)+' yet — ＋ to add.')); }
      }); };

    relField('With',withTid(),'person',{subject:()=>getEntry(e.id),
      expandTids:[partofTid(),ofTid()]});
    // From/To only when the deed `is a` Travel (found by title);
    // everything else is at one place.
    const act=outOne(e.id,doingTid());
    const travelE=DB.entries.find(x=>!x.deleted&&x.title
      &&x.title.toLowerCase()==='travel');
    if(act&&travelE&&isLinkedTo(act.id,travelE.id,[isaTid()])){
      relField('From',atTid(),'place',{exclusive:true,
        subject:()=>getEntry(e.id)});
      relField('To',atTid(),'place',{exclusive:true,
        subject:()=>endEntryOf(e.id),
        ensureSubject:ensureEnd});
    } else {
      relField('At',atTid(),'place',{exclusive:true,
        subject:()=>getEntry(e.id)});
    }

    const ghost=[outOne(e.id,doingTid()),...outAll(e.id,objectTid())]
      .find(x=>x&&hasStatus(x.id,'todo'));
    if(ghost){
      const done=el('button','bigbtn','✓ task done');
      done.addEventListener('click',()=>{
        const en=isActive?concludeInterval(e):(endEntryOf(e.id)||null);
        fulfillGhost(ghost.id,(en||e).id);
        Modal.closeAll(); });
      body.appendChild(done); }

    body.appendChild(el('div','f-lbl','Entries'));
    const foot=el('div','chiprow'); body.appendChild(foot);
    const sb=el('button','chip','begin entry…');
    sb.addEventListener('click',()=>openEditor(e.id)); foot.appendChild(sb);
    if(endE){ const eb=el('button','chip','end entry…');
      eb.addEventListener('click',()=>openEditor(endE.id)); foot.appendChild(eb); }

    const del=el('button','dangerbtn','Delete start and end');
    del.addEventListener('click',()=>{
      if(confirm('Delete the begin'+(endE?' and end entries':' entry')
          +'? (soft delete; links detach)')){
        if(endE) deleteEntry(endE.id);
        deleteEntry(e.id);
        Modal.pop(); } });
    body.appendChild(del);
  });
}

// ==== SEC:APP/UI/PICK_ENTRY (BEGIN) ====
// The entry picker: search box + view chip up top, a chip CLOUD below —
// wrapped pills, alphabetized by display text so positions stay stable
// as the vocabulary saturates. No hierarchy is drawn. Without a query,
// every entry the view matches is a chip. With a query, search still
// matches parents, but only the matches themselves and the matches'
// children are shown — no ancestor rows; a chip present only because
// its parent matched wears a dashed border. Typing something that
// doesn't exist offers a leading ＋ chip that creates the title and
// picks it at once. The view chosen here is remembered per fieldKey.
const MAX_PICKER_CHIPS=250;
function pickEntry(fieldKey,onPick){
  const state={q:''};
  Modal.push((m,body)=>{
    const top=el('div','mtop');
    const q=el('input'); q.placeholder='Search or type a new title…';
    q.addEventListener('input',()=>{state.q=q.value;draw();});
    top.appendChild(q);
    const cancel=el('button','cancel','Cancel');
    cancel.addEventListener('click',()=>Modal.pop());
    top.appendChild(cancel);
    m.insertBefore(top,body);

    const vrow=el('div'); vrow.style.cssText='padding:0 0 8px';
    body.appendChild(vrow);
    const box=el('div','chipcloud'); body.appendChild(box);

    const pick=e=>{ onPick(e); Modal.pop(); };   // callback first: pop() re-renders the stack from data
    function draw(){
      vrow.innerHTML=''; box.innerHTML='';
      const view=Mem.get(fieldKey,DB.settings.allViewId);
      const vchip=el('button','chip','view: '+view.name);
      vchip.addEventListener('click',()=>pickView(vw=>{Mem.set(fieldKey,vw.id);draw();}));
      vrow.appendChild(vchip);

      const typeIds=typeIdsOf(view), matched=viewMatches(view);
      const qq=state.q.trim();
      let ids, kidsOnly=new Set();
      if(qq){
        const hits=new Set();
        matched.forEach(id=>{ const e=getEntry(id);
          if(e&&fuzzy(qq,e.title?e.title:(e.body||''))>=0) hits.add(id); });
        ids=new Set(hits);
        hits.forEach(id=>matchedChildren(id,matched,typeIds).forEach(k=>{
          if(!hits.has(k.id)){ ids.add(k.id); kidsOnly.add(k.id); } }));
      } else ids=matched;

      if(qq){                                  // create-and-pick, first in the cloud
        const mk=el('button','chip new','＋ '+qq);
        mk.addEventListener('click',()=>{ pick(createEntry({title:qq})); });
        box.appendChild(mk);
      }
      const list=[...ids].map(getEntry).filter(Boolean).sort(chipCmp);
      list.slice(0,MAX_PICKER_CHIPS).forEach(e=>{
        const c=el('button','chip'+(kidsOnly.has(e.id)?' kid':'')+(e.title?'':' untitled'),disp(e));
        c.addEventListener('click',()=>pick(e));
        box.appendChild(c); });
      if(list.length>MAX_PICKER_CHIPS)
        box.appendChild(el('div','empty','+'+(list.length-MAX_PICKER_CHIPS)+' more — refine the search.'));
      else if(!list.length&&!qq)
        box.appendChild(el('div','empty','Nothing here yet.'));
    }
    draw();
    setTimeout(()=>q.focus(),60);
  });
}

// ==== SEC:APP/UI/EDIT_TASK (BEGIN) ====
// The task sheet — triage for Noted jots and the editor for ghosts,
// one surface (they differ only in state). Fields:
//   Title — inline; formalizing a jot usually starts with rewording.
//   Status — `is` chips over the Status lexicon with scoped
//   exclusivity (setIs); tapping the selected one clears it.
//   Complements — `is a` members of Activity (exclusive), expandable
//   only along `is a` links: declares the task's verb via
//   `complements`, after which the row reads verb-first.
//   Project — `is a` members of Project, expandable along `part of` /
//   `of` links, exclusive by gesture with a [part of|of] mode toggle:
//   selecting replaces the item's existing part-of/of links; `of`
//   makes the super part of this entry's handle forever.
//   Due — date-time picker; picking mints a bare moment AT the chosen
//   time and links due -> it FROM THE PROMISE when a wrapper exists
//   (the deadline is the promise's clause), else from the to-do
//   itself; re-picking moves the same moment; × removes only the
//   link. Minting a wrapper migrates a to-do-borne due link onto it.
//   Promised to — Person cloud. Selecting someone MINTS the wrapping
//   promise: a moment doing -> Promised (found by title among
//   Activity members, minted if absent), recipient -> person,
//   object -> this ghost, taking over the ghost's due link. "Plan"
//   mints the same wrapper on Planned, with no recipient. Nothing is
//   created silently.
// Fulfillment is the ☑ tab's tick box, not a sheet button.
function openTaskSheet(id){
  Modal.push((m,body)=>{
    const e=getEntry(id);
    if(!e){ body.appendChild(el('div','empty','Entry was deleted.')); return; }

    body.appendChild(el('div','f-lbl','Task'));
    const top=el('div','f-toprow');
    const ti=el('input','f-title'); ti.placeholder='Title'; ti.value=e.title||'';
    ti.addEventListener('input',()=>updateEntry(e.id,{title:ti.value.trim()||null}));
    top.appendChild(ti);
    const ed=el('button','tbtn','open…'); ed.title='Full entry editor';
    ed.addEventListener('click',()=>openEditor(e.id));
    top.appendChild(ed);
    body.appendChild(top);

    body.appendChild(el('div','f-lbl','Status'));
    const srow=el('div','chiprow'); body.appendChild(srow);
    const drawStatus=()=>{ srow.innerHTML='';
      childrenOf(anchor('status').id,[isaTid()]).sort(chipCmp).forEach(s=>{
        const sel=isLinkedTo(e.id,s.id,[isTid()]);
        srow.appendChild(entryChip(s,{cls:sel?'sel':'',onTap:()=>{
          if(sel) clearIs(e.id,s.id); else setIs(e.id,s.id);
          Modal.refresh(); UI.rerender(); }})); }); };
    drawStatus();

    body.appendChild(el('div','f-lbl','Complements'));
    const vrow=el('div','chiprow'); body.appendChild(vrow);
    const cst=tabState('sheet-comp-'+e.id);
    expandableCloud(vrow,cst,{
      top:()=>childrenOf(anchor('activity').id,[isaTid()]),
      childTids:[isaTid()],
      filter:list=>list.filter(x=>x.id!==e.id),
      renderChip:(rw,x)=>{
        const cur=outOne(e.id,complementsTid());
        const sel=cur&&cur.id===x.id;
        rw.appendChild(entryChip(x,{cls:sel?'sel':'',onTap:()=>{
          liveEdges().forEach(g=>{ if(g.from_id===e.id&&g.type_id===complementsTid())
            removeEdge(g.id); });
          if(!sel) addEdge(e.id,x.id,complementsTid());
          Modal.refresh(); }})); },
      emptyMsg:'No activities yet.'});

    body.appendChild(el('div','f-lbl','Project'));
    const pmode=el('div','chiprow'); body.appendChild(pmode);
    const prow=el('div','chiprow'); body.appendChild(prow);
    const pst=tabState('sheet-proj-'+e.id); pst.mode=pst.mode||'part of';
    const modeChip=el('button','chip sel',pst.mode);
    modeChip.title='Toggle link type: part of / of';
    modeChip.addEventListener('click',()=>{
      pst.mode=pst.mode==='part of'?'of':'part of';
      modeChip.textContent=pst.mode; });
    pmode.appendChild(modeChip);
    const setParent=k=>{
      liveEdges().forEach(g=>{ if(g.from_id===e.id
        &&[partofTid(),ofTid()].includes(g.type_id)) removeEdge(g.id); });
      if(k) addEdge(e.id,k.id,pst.mode==='of'?ofTid():partofTid());
      Modal.refresh(); };
    expandableCloud(prow,pst,{
      top:()=>childrenOf(anchor('project').id,[isaTid()]),
      childTids:[partofTid(),ofTid()],
      filter:list=>list.filter(x=>x.id!==e.id),
      renderChip:(rw,k)=>{
        const selSet=new Set([...outAll(e.id,partofTid()),
                              ...outAll(e.id,ofTid())].map(x=>x.id));
        const sel=selSet.has(k.id);
        rw.appendChild(entryChip(k,{cls:sel?'sel':'',
          onTap:()=>setParent(sel?null:k)})); },
      extras:(rw,rootId)=>{
        const add=el('button','chip add','＋ new…');
        add.addEventListener('click',()=>{
          const under=rootId?getEntry(rootId):anchor('project');
          const t=prompt('New entry under '+handle(under)+':');
          if(t&&t.trim()){ const n=createEntry({title:t.trim()});
            addEdge(n.id,under.id,rootId?partofTid():isaTid());
            setParent(n); } });                    // mint AND select
        rw.appendChild(add); },
      emptyMsg:'No projects yet — ＋ to add.'});

    body.appendChild(el('div','f-lbl','Due'));
    const drow=el('div','chiprow'); body.appendChild(drow);
    const wrappers=()=>backlinksOf(e.id)
      .filter(x=>x.edge.type_id===objectTid());
    const drawDue=()=>{ drow.innerHTML='';
      const ws=wrappers();
      const subj=ws.length?ws[0].node:e;     // the due clause lives on the promise
      const g=liveEdges().find(x=>x.from_id===subj.id
        &&x.type_id===dueTid()&&getEntry(x.to_id));
      const dueE=g?getEntry(g.to_id):null;
      const btn=el('button','chip'+(dueE?' sel':''),dueE?fmtDT(dueE.ts):'set due…');
      btn.style.position='relative';
      const inp=el('input','tsnative'); inp.type='datetime-local';
      inp.setAttribute('tabindex','-1'); inp.setAttribute('aria-hidden','true');
      inp.addEventListener('change',()=>{ const iso=fromLocalInput(inp.value);
        if(!iso) return;
        if(dueE) updateEntry(dueE.id,{ts:iso});
        else { const d=createEntry({ts:iso}); addEdge(subj.id,d.id,dueTid()); }
        drawDue(); });
      btn.appendChild(inp);
      btn.addEventListener('click',()=>{
        inp.value=toLocalInput(dueE?dueE.ts:nowISO());
        try{ inp.showPicker?inp.showPicker():inp.focus(); }
        catch(err){ inp.focus(); } });
      drow.appendChild(btn);
      if(dueE){ const x=el('button','chip','×'); x.title='Remove due';
        x.addEventListener('click',()=>{ removeEdge(g.id); drawDue(); });
        drow.appendChild(x); } };
    drawDue();

    // Promise wrapper. Finds-or-mints the verb by title among Activity
    // members — Promised/Planned are the keeper's vocabulary, not seeds.
    const verbByTitle=t=>{ let v=childrenOf(anchor('activity').id,[isaTid()])
        .find(x=>x.title===t);
      if(!v){ v=createEntry({title:t}); addEdge(v.id,anchor('activity').id,isaTid()); }
      return v; };
    const mintWrapper=(verbTitle,person)=>{
      const w=createEntry();
      addEdge(w.id,verbByTitle(verbTitle).id,doingTid());
      addEdge(w.id,e.id,objectTid());
      if(person) addEdge(w.id,person.id,recipientTid());
      const dg=liveEdges().find(x=>x.from_id===e.id
        &&x.type_id===dueTid()&&getEntry(x.to_id));
      if(dg){ addEdge(w.id,dg.to_id,dueTid()); removeEdge(dg.id); }
      toast(verbTitle+(person?' '+oblique(person):''));
      Modal.refresh(); };
    body.appendChild(el('div','f-lbl','Promised to'));
    const wrow=el('div','chiprow'); body.appendChild(wrow);
    const drawPromise=()=>{ wrow.innerHTML='';
      const ws=wrappers();
      ws.forEach(x=>wrow.appendChild(entryChip(x.node,{cls:'sel',
        onTap:()=>openEditor(x.node.id)})));
      childrenOf(anchor('person').id,[isaTid()]).sort(chipCmp).forEach(p=>{
        wrow.appendChild(entryChip(p,{onTap:()=>mintWrapper('Promised',p)})); });
      const plan=el('button','chip','plan (to myself)');
      plan.addEventListener('click',()=>mintWrapper('Planned',null));
      wrow.appendChild(plan);
      const np=el('button','chip add','＋ person…');
      np.addEventListener('click',()=>{ const t=prompt('New person:');
        if(t&&t.trim()){ const p=createEntry({title:t.trim()});
          addEdge(p.id,anchor('person').id,isaTid());
          mintWrapper('Promised',p); } });
      wrow.appendChild(np); };
    drawPromise();
  });
}

// name, ancestor conditions (+/×, ANDed), containment link types.
function openViewEditor(viewId){
  Modal.push((m,body)=>{
    const vw=getView(viewId);
    if(!vw){ body.appendChild(el('div','empty','View was deleted.')); return; }
    body.appendChild(el('div','f-lbl','View name'));
    const nm=el('input','f-title'); nm.value=vw.name;
    nm.addEventListener('input',()=>{vw.name=nm.value||'view';touch(vw);save();});
    body.appendChild(nm);

    body.appendChild(el('div','f-lbl','Conditions — entry must descend from ALL of:'));
    const crow=el('div','chiprow'); body.appendChild(crow);
    function drawConds(){
      crow.innerHTML='';
      vw.cond_ids=vw.cond_ids.filter(id=>getEntry(id));      // self-repair danglers
      vw.cond_ids.forEach(cid=>{
        crow.appendChild(entryChip(getEntry(cid),{onRemove:()=>{
          vw.cond_ids=vw.cond_ids.filter(x=>x!==cid); touch(vw); save(); drawConds(); }})); });
      const add=el('button','chip add','＋ condition');
      add.addEventListener('click',()=>pickEntry('viewEditor.cond',e=>{
        if(!vw.cond_ids.includes(e.id))vw.cond_ids.push(e.id); touch(vw); save(); drawConds(); }));
      crow.appendChild(add);
      if(!vw.cond_ids.length) crow.appendChild(el('span','f-created','(none — matches everything)'));
    }
    drawConds();

    body.appendChild(el('div','f-lbl','Containment link types'));
    const trow=el('div','chiprow'); body.appendChild(trow);
    liveTypes().forEach(t=>{
      const on=vw.type_ids.includes(t.id);
      const c=el('button','chip'+(on?' sel':''),t.name);
      c.addEventListener('click',()=>{
        vw.type_ids=on?vw.type_ids.filter(x=>x!==t.id):[...vw.type_ids,t.id];
        touch(vw); save(); Modal.refresh(); });
      trow.appendChild(c); });

    if(!vw.locked){
      const del=el('button','dangerbtn','Delete view');
      del.addEventListener('click',()=>{ if(confirm('Delete view “'+vw.name+'”?')){
        vw.deleted=1; touch(vw); save(); Modal.pop(); } });
      body.appendChild(del); }
  });
}

// Per-class configuration for workflow tabs.
function openTabEditor(tabId){
  Modal.push((m,body)=>{
    const t=getTab(tabId);
    if(!t){ body.appendChild(el('div','empty','Tab was deleted.')); return; }
    body.appendChild(el('div','f-lbl',t.cls+' tab — label'));
    const lbl=el('input','f-title'); lbl.value=t.label;
    lbl.addEventListener('input',()=>{t.label=lbl.value||'·';touch(t);save();renderTabbar();});
    body.appendChild(lbl);
    const c=t.cfg;

    const entryField=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getEntry(c[key]):null;
      const f=el('button','f-field',cur?disp(cur):'pick…');
      f.addEventListener('click',()=>pickEntry('tabEditor.'+key,e=>{
        c[key]=e.id; touch(t); save(); Modal.refresh(); }));
      body.appendChild(f); };
    const viewFieldCfg=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getView(c[key]):null;
      const f=el('button','f-field',cur?cur.name:'pick…');
      f.addEventListener('click',()=>pickView(vw=>{c[key]=vw.id;touch(t);save();Modal.refresh();}));
      body.appendChild(f); };
    const typeFieldCfg=(label,key)=>{
      body.appendChild(el('div','f-lbl',label));
      const cur=c[key]?getType(c[key]):null;
      const f=el('button','f-field',cur?cur.name:'pick…');
      f.addEventListener('click',()=>pickType(tp=>{c[key]=tp.id;touch(t);save();Modal.refresh();}));
      body.appendChild(f); };

    if(t.cls==='create'){
      c.def=c.def||{};
      body.appendChild(el('div','f-lbl','Default title'));
      const dt=el('input','f-title'); dt.value=c.def.title||'';
      dt.addEventListener('input',()=>{c.def.title=dt.value||null;touch(t);save();});
      body.appendChild(dt);
      body.appendChild(el('div','f-lbl','Default body'));
      const db=el('textarea','f-body short'); db.value=c.def.body||'';
      db.addEventListener('input',()=>{c.def.body=db.value||null;touch(t);save();});
      body.appendChild(db);
      body.appendChild(el('div','f-lbl','Default links'));
      const lr=el('div','chiprow'); body.appendChild(lr);
      function drawDef(){
        lr.innerHTML=''; c.def.links=(c.def.links||[]).filter(l=>getEntry(l.to));
        c.def.links.forEach((l,i)=>{
          lr.appendChild(entryChip(getEntry(l.to),{typeLabel:getType(l.type)?.name,
            onRemove:()=>{c.def.links.splice(i,1);touch(t);save();drawDef();}})); });
        const add=el('button','chip add','＋');
        add.addEventListener('click',()=>pickEntry('tabEditor.deflink',e=>{
          c.def.links.push({to:e.id,type:isaTid()});
          touch(t); save(); drawDef(); }));
        lr.appendChild(add); }
      drawDef();
    }
    else if(t.cls==='explore'){ viewFieldCfg('Default view','view_id'); }
  });
}
// ==== SEC:APP/UI/EDIT_TAB (END) ====

// ==== SEC:APP/UI/MENU (BEGIN) ====
// "⋯": sync, portability and reset actions live on their own tab. The
// tab itself is synthetic (renderTabbar appends it after the data
// tabs), so it exists on every device regardless of DB contents.
function renderMenuTab(v){
  const st=tabState('menu');
  if(st.page){                               // editor sub-pages
    const back=el('button','bigbtn','← Back'); back.style.marginTop='0';
    back.addEventListener('click',()=>{ st.page=null; UI.rerender(); });
    v.appendChild(back);
    if(st.page==='views') renderViews(v,{id:'menu.views'});
    else if(st.page==='links') renderLinks(v);
    else if(st.page==='tabs') renderTabs(v);
    return;
  }
  const status=(Store.memoryOnly?'Storage: MEMORY ONLY — export to keep data. ':'Storage: this browser. ')
    +DB.entries.filter(e=>!e.deleted).length+' entries, '
    +liveEdges().length+' links, '+liveViews().length+' views. '
    +(Sync.configured()
      ?('Drive: '+Sync.status
        +(Sync.st.realm?(' · '+Sync.st.realm+' g'+(Sync.st.generation||0)):'')+'.')
      :'Drive: not set up.');
  v.appendChild(el('div','f-created',status));
  const btn=(label,fn,cls)=>{ const b=el('button','bigbtn'+(cls?' '+cls:''),label);
    b.addEventListener('click',fn); v.appendChild(b); return b; };
  btn('Views…',()=>{ st.page='views'; UI.rerender(); });
  btn('Link types…',()=>{ st.page='links'; UI.rerender(); });
  btn('Tabs…',()=>{ st.page='tabs'; UI.rerender(); });
  const syncLbl={off:'Set up Drive sync…','need-auth':'Drive: sign in',
    ok:'Sync now',error:'Sync now (retry)',syncing:'Syncing…'}[Sync.status]||'Drive sync';
  btn(syncLbl,()=>{ if(!Sync.configured())Sync.setup();
    else Sync.syncNow(true).then(()=>UI.rerender()); });
  if(Sync.configured()) btn('Drive settings…',()=>Sync.setup());
  btn('Sync diagnostics…',()=>Menu.diagnostics());
  btn('Snapshots / restore…',()=>Menu.snapshots());
  btn('Export NDJSON',()=>exportNDJSON());
  btn('Import & merge…',()=>{ importMode='merge'; $('#importfile').click(); });
  btn('Import & replace…',()=>{ importMode='replace'; $('#importfile').click(); });
  btn('Wipe local data…',()=>Menu.wipeLocal(),'danger');
  btn('New realm (reset all)…',()=>Sync.newRealm(),'danger');
}
const Menu={
  diagnostics(){
    const d=Sync.diagnostics();
    Modal.push((m,body)=>{
      body.appendChild(el('div','f-lbl','Sync diagnostics'));
      const rows=[
        ['deviceId',d.deviceId],
        ['sync configured',d.syncConfigured?'yes':'no'],
        ['token',d.token],
        ['realm',d.realm],
        ['generation',String(d.generation)],
        ['drive file id',d.fileId],
        ['remote modified',d.remoteModifiedTime],
        ['entries/edges',d.tableCounts.entries+' / '+d.tableCounts.edges],
        ['types/views/tabs',d.tableCounts.linkTypes+' / '+d.tableCounts.views+' / '+d.tableCounts.tabs]
      ];
      rows.forEach(([k,v])=>{
        const r=el('div','cfg-row');
        r.appendChild(el('span','nm',k));
        const vv=el('span','mt diag-val',v);
        r.appendChild(vv); body.appendChild(r); });
    });
  },
  snapshots(){
    Modal.push((m,body)=>{
      body.appendChild(el('div','f-lbl','Snapshots / restore'));
      body.appendChild(el('div','f-created',
        'Restoring replaces the data of every synced device with the snapshot: a new realm is minted from its contents, and each device follows on its next sync.'));
      if(Sync.st.realm)
        body.appendChild(el('div','f-created','Current realm: '+Sync.st.realm+' · generation '+(Sync.st.generation||0)));
      const box=el('div'); body.appendChild(box);
      const renderFiles=(files)=>{
        box.innerHTML='';
        if(!files.length){ box.appendChild(el('div','empty','No snapshots found.')); return; }
        files.forEach(f=>{
          const rawLabel=String(f.name||f.id||'snapshot').replace(/\s+/g,' ');
          const label=rawLabel.length>MAX_SNAPSHOT_LABEL_LENGTH
            ? rawLabel.slice(0,MAX_SNAPSHOT_LABEL_LENGTH-1)+'…'
            : rawLabel;
          const r=el('div','cfg-row');
          r.appendChild(el('span','nm',label));
          r.appendChild(el('span','mt',fmtDT(f.modifiedTime||nowISO())));
          const rs=el('button','mini','Restore');
          rs.addEventListener('click',()=>{
            if(!confirm('Restore snapshot "'+label+'" for ALL synced devices? Each device saves its own snapshot before following.')) return;
            Sync.restoreSnapshot(f).catch(()=>toast('Restore failed — try again')); });
          r.appendChild(rs);
          box.appendChild(r);
        });
      };
      const refresh=()=>{
        if(!Sync.configured()){ box.innerHTML=''; box.appendChild(el('div','empty','Set up Drive sync first.')); return; }
        Sync.ensureToken(true).then(()=>Sync.listSnapshots()).then(renderFiles)
          .catch(()=>toast('Could not load snapshots'));
      };
      const mk=el('button','bigbtn','Create snapshot now');
      mk.addEventListener('click',()=>{
        if(!Sync.configured()){ toast('Set up Drive sync first'); return; }
        Sync.ensureToken(true).then(()=>Sync.createSnapshot()).then(()=>{
          toast('Snapshot created'); refresh(); })
          .catch(()=>toast('Snapshot failed — try again')); });
      body.appendChild(mk);
      const rf=el('button','bigbtn','Refresh snapshot list');
      rf.addEventListener('click',refresh); body.appendChild(rf);
      refresh();
    });
  },
  // Device-only reset. Realm membership is kept, so the next sync pulls
  // the realm's data straight back — useful for exercising the join
  // path. A reset that sticks everywhere is Sync.newRealm().
  // Sync.st.remoteTime is cleared so pull()'s modifiedTime short-circuit
  // cannot skip the download and let a push overwrite the realm file
  // with the bare seed.
  wipeLocal(){
    const n=DB.entries.filter(e=>!e.deleted).length;
    if(!confirm('Wipe local data on this device? '+n+' entries plus all links, views and tabs are deleted and the app re-seeded. '
      +(Sync.configured()&&Sync.st.realm
        ?'The device stays in its realm, so the next sync restores the realm\u2019s data.'
        :'Google Drive is not touched.'))) return;
    if(!confirm('Last chance — consider Export NDJSON first. Wipe local data now?')) return;
    clearTimeout(Sync.pushTimer);                    // cancel any queued push of the old data
    Sync.st.remoteTime=null; Sync.saveCfg();
    resetLocalStore();
    toast(Sync.configured()&&Sync.st.realm
      ?'Local data wiped — next sync restores the realm'
      :'Local data wiped'); } };
let importMode='merge';
$('#importfile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>importText(r.result,importMode); r.readAsText(f);
  ev.target.value=''; });
// ==== SEC:APP/UI/MENU (END) ====

// ==== SEC:APP/UI (END) ================================================

// ==== SEC:APP/BOOT (BEGIN) ====
load();
migrateIds();        // numeric -> device-prefixed global ids (one-shot)
initCounters();      // per-device id counters, derived by scan
seed();              // no-op unless the DB is empty
ensureSeedTabs();
ensureSeedLinkTypes(); // types newer than this store's first seed
ensureAnchors();     // lexicon roots + statuses on stores that predate them
UI.tabId=liveTabs()[0]?.id;
UI.rerender();
Sync.init();         // silent Drive sync attempt if configured
// ==== SEC:APP/BOOT (END) ====

// ==== SEC:APP (END) ===================================================
</script>
