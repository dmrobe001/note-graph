<!doctype html>
<!-- ================================================================
     ==== SEC:HEADER (BEGIN) ========================================
     Articulate 4.0
     Everything is an entry; relations are typed edges; "task",
     "status", and "interval" are conventions expressed as ordinary
     entries, views, and tabs. A first-run seed provides a default
     working configuration.

     Storage identifiers (localStorage keys, the Drive sync filename,
     NDJSON record tags) are stable wire-level names; they are kept
     constant across releases so data always outlives the code.

     Schema (all references by persistent ID; only id/created_at
     immutable; soft delete everywhere; every record carries
     updated_at, bumped on mutation, for last-write-wins merging):
       IDs        globally unique strings "{deviceId}-{letter}{n}"
                  (letter: e entry, g edge, t linktype, v view, b tab)
                  so records created offline on different devices
                  never collide. deviceId is per-install, stored
                  OUTSIDE the DB and never synced.
       entries    id, created_at, ts, updated_at, title, body,
                  estimate_min, deleted
       edges      id, from_id, to_id, type_id, created_at,
                  updated_at, deleted
                  (every semantic edge points OUTWARD from the
                   sentence's subject: is a / part of / of /
                   complements build the map; by, doing, object,
                   recipient, beneficiary, complement, with, at,
                   until, due, fulfills are the clauses of a moment;
                   an interval's begin entry points until -> its end)
       linkTypes  id, name, locked, updated_at, deleted
       views      id, name, cond_ids[] (ancestor conditions, ANDed),
                  type_ids[] (containment link types), locked,
                  updated_at, deleted
       tabs       id, cls, label, pos, cfg{...}, updated_at
                  cls ∈ create | inbox | active | todo | explore |
                  views | links | tabs
       settings   allViewId, mem{fieldKey -> id}, migratedV1,
                  idsMigrated, dirty (false only while the DB holds
                  nothing but seed data; a pristine device ADOPTS
                  incoming sync data instead of merging, so two
                  fresh seeds never duplicate keystones)

     SECTION MANIFEST (grep "SEC:"; every section has (BEGIN)/(END)):
       SEC:HEADER              this manifest
       SEC:STYLE               all CSS
         SEC:STYLE/TOKENS        palette, type, radii
         SEC:STYLE/BASE          resets, shell, typography
         SEC:STYLE/RUNBAR        active-intervals bar
         SEC:STYLE/NAV           scrollable bottom tab bar
         SEC:STYLE/TREE          shared entry tree rows
         SEC:STYLE/CHIPS         chips & badges
         SEC:STYLE/FORMS         inputs, editor fields
         SEC:STYLE/LISTS         config lists (views/links/tabs)
         SEC:STYLE/MODAL         modal stack & scrim
         SEC:STYLE/MISC          menu, toast, banner, empty
       SEC:MARKUP              static DOM shell
       SEC:APP                 all JavaScript
         SEC:APP/UTIL            dom/date/format helpers
         SEC:APP/STORE           persistence + flush-on-hide
         SEC:APP/IDS             device id, id factory, migration of
                                 legacy numeric ids to global ids
         SEC:APP/MODEL           CRUD for all five tables (+touch)
         SEC:APP/SEED            first-run seed (fixed 'seed-…' ids)
         SEC:APP/QUERY           containment, view matching, trees,
                                 search, active intervals
         SEC:APP/EXPORT          NDJSON serialize/parse/export
         SEC:APP/MERGE           union + last-write-wins merge
         SEC:APP/SYNC            Google Drive sync: realm pointer,
                                 pull-merge-push, snapshots, resets
         SEC:APP/UI              view layer
           SEC:APP/UI/ROOT         tab bar, routing, rerender
           SEC:APP/UI/RUNBAR       live active-interval summary
           SEC:APP/UI/MODAL        modal stack infrastructure
           SEC:APP/UI/TREE         shared tree renderer
           SEC:APP/UI/CHIPS        shared chip builders
           SEC:APP/UI/TAB_CREATE   "+" capture tab
           SEC:APP/UI/TAB_INBOX    "❗" Noted inbox tab
           SEC:APP/UI/TAB_ACTIVE   "🕓" active intervals tab
           SEC:APP/UI/TAB_EXPLORE  "🧭" browse/edit tab
           SEC:APP/UI/TAB_TODO     "☑" ghosts (is -> To-Do)
           SEC:APP/UI/TAB_VIEWS    "🔎" view config tab
           SEC:APP/UI/TAB_LINKS    "🔗" link-type config tab
           SEC:APP/UI/TAB_TABS     "🕮" tab config tab
           SEC:APP/UI/EDITOR       entry editor modal
           SEC:APP/UI/EDIT_INTERVAL interval sheet (with/from/to)
           SEC:APP/UI/PICK_ENTRY   entry picker (search+chip cloud)
           SEC:APP/UI/PICK_VIEW    view picker
           SEC:APP/UI/PICK_TYPE    link-type picker
           SEC:APP/UI/EDIT_TASK    task sheet (status/doing/due/promise)
           SEC:APP/UI/EDIT_VIEW    view editor modal
           SEC:APP/UI/EDIT_TAB     tab config modal
           SEC:APP/UI/MENU         the ⋯ tab: editors, sync, resets
         SEC:APP/BOOT            init
     ==== SEC:HEADER (END) ========================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131518">
<title>Articulate</title>
<style>
/* ==== SEC:STYLE (BEGIN) ============================================ */

/* ==== SEC:STYLE/TOKENS (BEGIN) ==== */
:root{
  --bg:#131518; --surface:#1b1e23; --surface2:#23272e; --line:#2c313a;
  --ink:#e7e4db; --muted:#8f939c; --faint:#5c616b;
  --accent:#93b878; --accent-dim:#3a4a33; --amber:#d9a44a; --danger:#c96f5e;
  --r:12px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
/* ==== SEC:STYLE/TOKENS (END) ==== */

/* ==== SEC:STYLE/BASE (BEGIN) ==== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{display:flex;flex-direction:column;height:100dvh}
#view{flex:1;overflow-y:auto;padding:8px 10px calc(20px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r);outline:none}
input:focus,textarea:focus{border-color:var(--accent-dim)}
::placeholder{color:var(--faint)}
.mono{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ==== SEC:STYLE/BASE (END) ==== */

/* ==== SEC:STYLE/RUNBAR (BEGIN) ==== */
#runbar{display:none;align-items:center;gap:8px;padding:7px 12px;overflow-x:auto;
  background:linear-gradient(180deg,#182016,var(--bg));border-bottom:1px solid var(--accent-dim)}
#runbar.on{display:flex}
#runbar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
  flex-shrink:0;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#runbar .rchip{display:inline-flex;gap:7px;align-items:center;white-space:nowrap;
  border:1px solid var(--accent-dim);border-radius:999px;padding:4px 11px;font-size:13px}
#runbar .rchip .el{font-family:var(--mono);color:var(--accent);font-size:12px}
#runbar .rchip.urgent{border-color:#7a3434;color:var(--danger)}
/* ==== SEC:STYLE/RUNBAR (END) ==== */

/* ==== SEC:STYLE/NAV (BEGIN) ==== */
#tabs{display:flex;overflow-x:auto;flex-shrink:0;
  background:color-mix(in srgb,var(--bg) 88%,black);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#tabs button{flex:1 0 60px;padding:6px 4px 8px;color:var(--faint);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
#tabs button .ico{font-size:20px;line-height:1}
#tabs button.active{color:var(--ink)}
#tabs button.active .ico{filter:none;color:var(--accent)}
/* ==== SEC:STYLE/NAV (END) ==== */

/* ==== SEC:STYLE/TREE (BEGIN) ==== */
.trow{display:flex;align-items:center;gap:2px;padding:0 2px;border-radius:10px;width:100%;text-align:left}
.trow:active{background:var(--surface)}
/* Row-action buttons keep 44x44 touch targets (Apple HIG 44pt / WCAG
   2.5.5). The expand chevron is deliberately narrow — 24px wide, full
   row height — matching the 24px-per-level indent so a level of
   depth costs exactly one chevron-width. Every row carries the same
   one-slot prefix (a blank spacer on leaf rows) so names at one depth
   always align, whatever the row's state. */
.trow .chev{width:24px;height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:var(--faint);font-size:20px;line-height:1}
/* Borders trace the exact touch targets in view lists: only real
   buttons get one — the blank alignment spacers on leaf rows are not
   targets and stay invisible. */
.trow button.chev{border:1px solid var(--line);border-radius:10px}
.trow .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center}
/* Dense mode (explore tab): 24px rows, single line, borders off. */
.dense .trow{border-radius:6px}
.dense .trow .chev{height:24px;width:24px;font-size:16px}
.dense .trow button.chev{border:none;border-radius:6px}
.dense .trow .nm{min-height:24px;padding:0 4px;border:none;font-size:14px}
.dense .trow .tbtn{height:24px;width:36px;font-size:16px;border-radius:6px}
.dense .flatrow{padding:1px 4px;border-radius:6px}
.trow .nm.untitled{color:var(--muted)}
.nm.tonly{font-weight:600}
.trow .nm.hit{color:var(--accent)}
.trow .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);padding:0 4px}
.trow .tbtn{width:44px;height:44px;flex-shrink:0;color:var(--faint);font-size:22px;
  border:1px solid transparent;border-radius:10px;display:flex;align-items:center;justify-content:center}
.trow .tbtn.add{color:var(--accent)}
.trow .tbtn.end{color:var(--accent);border-color:var(--accent-dim);font-size:12px;width:auto;padding:0 12px}
.flatrow{display:block;width:100%;text-align:left;padding:6px 4px;border-radius:10px}
.flatrow:active{background:var(--surface)}
.flatrow .line{display:flex;gap:8px;align-items:baseline}
/* Flat rows wrap onto as many lines as the sentence needs. */
.flatrow .nm{font-size:15px;white-space:normal;overflow-wrap:anywhere;min-width:0}
/* Every flat row leads with its time (or start–end range) inline. */
.flatrow .rng{font-family:var(--mono);font-size:11px;color:var(--faint);flex-shrink:0}
/* ==== SEC:STYLE/TREE (END) ==== */

/* ==== SEC:STYLE/CHIPS (BEGIN) ==== */
.chip{display:inline-flex;align-items:center;gap:6px;max-width:48%;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:13px;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chipcloud{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:2px 0}
.chipcloud .chip.untitled{color:var(--muted)}
.chipcloud .chip.kid{border-style:dashed}          /* shown because its parent matched */
.chipcloud .chip.new{color:var(--accent);border-color:var(--accent-dim)}
.chip.linked{border-color:var(--accent-dim);background:#20261e}
.chip.add{color:var(--muted);border-style:dashed}
.chip.sel{border-color:var(--accent);background:#243020}
.chip .ty{font-family:var(--mono);font-size:10px;color:var(--faint);
  border-left:1px solid var(--line);padding-left:6px}
.chip .x{color:var(--faint);font-size:15px;padding-left:2px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
/* ==== SEC:STYLE/CHIPS (END) ==== */

/* ==== SEC:STYLE/FORMS (BEGIN) ==== */
.f-toprow{display:flex;gap:6px;align-items:center;margin:0 0 8px}
/* The timestamp is a tap-to-edit label (native inline datetime widgets
   can't follow the display rules or drop their picker arrow); the real
   input is invisible underneath and only its picker dialog is used. */
.tsbtn{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:4px 8px;border-radius:10px;cursor:pointer;color-scheme:dark}
.tsbtn:active{background:var(--surface2)}
.tsbtn .tslbl{display:flex;flex-direction:column;line-height:1.15;text-align:center;
  font-family:var(--mono);pointer-events:none}
.tsbtn .tslbl .d{font-size:10px;color:var(--faint)}
.tsbtn .tslbl .t{font-size:13px;color:var(--muted)}
.tsbtn .tsnative{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;pointer-events:none}
.f-toprow .f-title{flex:1;min-width:0;margin:0}
.tbtn-add{width:44px;height:44px;flex-shrink:0;color:var(--accent);font-size:20px;
  border:1px solid var(--accent-dim);border-radius:10px}
.f-created{font-family:var(--mono);font-size:11px;color:var(--faint)}
.f-title{width:100%;padding:8px 10px;font-size:15px;margin-bottom:6px;background:transparent;border:1px dashed var(--line)}
.f-title:focus{border-style:solid}
.f-body{width:100%;min-height:30dvh;padding:10px;font-size:17px;line-height:1.5;resize:vertical}
.f-body.short{min-height:80px;font-size:15px}
.f-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:12px 2px 5px}
.f-field{padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r);
  color:var(--faint);font-size:14px;width:100%;text-align:left}
.f-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f-row .f-field{flex:1;width:auto;min-width:0}
.bigbtn{margin-top:10px;width:100%;padding:10px;border:1px solid var(--line);
  border-radius:var(--r);color:var(--muted);font-size:14px;background:var(--surface)}
.bigbtn.go{color:var(--accent);border-color:var(--accent-dim)}
.dangerbtn{margin-top:12px;color:var(--danger);font-size:13px;padding:8px 0}
.bigbtn.danger{color:var(--danger);border-color:#4a332e}
/* ==== SEC:STYLE/FORMS (END) ==== */

/* ==== SEC:STYLE/LISTS (BEGIN) ==== */
.cfg-row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:var(--r);width:100%;text-align:left}
.cfg-row:active{background:var(--surface)}
.cfg-row .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-row .mt{font-family:var(--mono);font-size:11px;color:var(--faint);flex-shrink:0}
.cfg-row .mini{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line);
  border-radius:8px;color:var(--muted);font-size:14px}
.sorttog{font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px}
/* ==== SEC:STYLE/LISTS (END) ==== */

/* ==== SEC:STYLE/MODAL (BEGIN) ==== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
#scrim.on{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column}  /* top set per stack depth in Modal.render */
.modal .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:7px auto 3px;flex-shrink:0}
.modal .mbody{overflow-y:auto;padding:6px 12px calc(18px + env(safe-area-inset-bottom))}
.modal .mtop{display:flex;gap:8px;padding:4px 12px 8px;align-items:center;flex-shrink:0}
.modal .mtop input{flex:1;padding:9px 12px;font-size:16px}
.modal .mtop .cancel{color:var(--muted);font-size:14px;flex-shrink:0}
/* ==== SEC:STYLE/MODAL (END) ==== */

/* ==== SEC:STYLE/MISC (BEGIN) ==== */
#membanner{display:none;background:#3a2f1a;color:var(--amber);font-size:12px;padding:7px 14px;text-align:center}
#membanner.on{display:block}
.diag-val{max-width:58%;text-align:right;word-break:break-all} /* keeps diagnostics rows readable on narrow screens */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.empty{color:var(--faint);text-align:center;padding:40px 20px;font-size:14px}
.empty.slim{padding:6px 4px}
/* ==== SEC:STYLE/MISC (END) ==== */

/* ==== SEC:STYLE (END) ============================================== */
</style>
</head>
<body>
<!-- ==== SEC:MARKUP (BEGIN) ========================================== -->
<div id="app">
  <div id="membanner">Memory-only mode — storage unavailable here. Export from ⋯ to keep data.</div>
  <nav id="tabs"></nav>
  <div id="runbar"><span class="dot"></span></div>
  <div id="view"></div>
</div>
<div id="scrim"></div>
<div id="mstack"></div>
<input type="file" id="importfile" accept=".ndjson,.txt,.json" style="display:none">
<div id="toast"></div>
<!-- ==== SEC:MARKUP (END) ============================================ -->

<script>
// ==== SEC:APP (BEGIN) =================================================

// ==== SEC:APP/UTIL (BEGIN) ====
const MAX_SNAPSHOT_LABEL_LENGTH=80;
const $  = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag);
  if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const nowISO = () => new Date().toISOString();
// Timestamp display: today -> "14:05"; within the last week ->
// "tue 14:05"; older or future -> "tue 7 jul 14:05"; and outside the
// current year the two-digit year follows the month: "tue 7 jul 25 14:05".
// fmtDTParts returns {date, time}; date is '' when the moment is today.
function fmtDTParts(iso){
  const d=new Date(iso); if(isNaN(d)) return {date:'',time:''};
  const now=new Date(), p=n=>String(n).padStart(2,'0');
  const time=p(d.getHours())+':'+p(d.getMinutes());
  const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const ago=(day0(now)-day0(d))/86400000;          // whole days in the past
  if(ago===0) return {date:'',time};
  const dow=['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];
  if(ago>0&&ago<7) return {date:dow,time};
  const mon=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][d.getMonth()];
  return {date:dow+' '+d.getDate()+' '+mon
    +(d.getFullYear()===now.getFullYear()?'':' '+p(d.getFullYear()%100)),time}; }
function fmtDT(iso){ const x=fmtDTParts(iso); return x.date?x.date+' '+x.time:x.time; }
function fmtDur(ms){ if(ms<0)ms=0; const m=Math.round(ms/60000);
  if(m<60) return m+'m'; const h=Math.floor(m/60),r=m%60; return r? h+'h '+r+'m' : h+'h'; }
function toLocalInput(iso){ const d=new Date(iso),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function fromLocalInput(v){ const d=new Date(v); return isNaN(d)?null:d.toISOString(); }
function disp(e){ return e.title || (e.body||'').split('\n')[0].slice(0,60) || fmtDT(e.ts); }
// Row-name emphasis: title-only entries are bold; untitled entries
// (body snippet or bare timestamp) are muted, plain roman, no bullet.
function dispCls(e){ return e.title ? (e.body?'':' tonly') : ' untitled'; }
// Chip-cloud order: seed entries first, then titled, then body-only,
// then bare timestamps; alphabetical within each band, except bare
// timestamps, which sort chronologically.
function chipRank(e){ if(String(e.id).startsWith('seed-')) return 0;
  if(e.title) return 1; if(e.body) return 2; return 3; }
function chipCmp(a,b){ const ra=chipRank(a),rb=chipRank(b);
  if(ra!==rb) return ra-rb;
  if(ra===3) return a.ts.localeCompare(b.ts);
  return disp(a).localeCompare(disp(b),undefined,{sensitivity:'base'}); }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1700); }
function fuzzy(q,s){ q=q.toLowerCase(); s=(s||'').toLowerCase();
  if(!q) return 0;
  const i=s.indexOf(q); if(i>=0) return 10-Math.min(9,i*0.5);
  let j=0; for(const ch of s){ if(ch===q[j])j++; if(j===q.length) return 2; }
  return -1; }
// ==== SEC:APP/UTIL (END) ====

// ==== SEC:APP/STORE (BEGIN) ====
// localStorage with in-memory fallback + loud banner (P2). Saves are
// debounced 120ms; saveNow() flushes, and is wired to visibilitychange
// and pagehide so a pocketed or dying phone commits the latest keystrokes.
const STORE_KEY='capturelog.v2';
const Store={ memoryOnly:false, _mem:null,
  read(k){ try{ return localStorage.getItem(k); }catch(e){ this.memoryOnly=true; return k===STORE_KEY?this._mem:null; } },
  write(str){ try{ localStorage.setItem(STORE_KEY,str); this.memoryOnly=false; }
    catch(e){ this.memoryOnly=true; this._mem=str; }
    $('#membanner').classList.toggle('on',this.memoryOnly); } };

let DB={ v:2,
  entries:[], edges:[], linkTypes:[], views:[], tabs:[],
  settings:{ allViewId:null, mem:{}, migratedV1:false, idsMigrated:false, dirty:false } };

let saveTimer=null;
let scheduleDriveSync=()=>{};          // replaced by SEC:APP/SYNC once defined
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,120); }
function persistNow(){ clearTimeout(saveTimer); Store.write(JSON.stringify(DB)); } // SEC:APP/STORE: silent write path
function saveNow(opts){ persistNow();
  if(!opts||opts.schedule!==false) scheduleDriveSync(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveNow(); });
window.addEventListener('pagehide',saveNow);
function load(){ const raw=Store.read(STORE_KEY);
  if(raw){ try{ DB=JSON.parse(raw); }catch(e){ console.error('load failed',e); } }
  if(!DB.settings) DB.settings={};
  if(!DB.settings.mem) DB.settings.mem={};
  $('#membanner').classList.toggle('on',Store.memoryOnly); }
// ==== SEC:APP/STORE (END) ====

// ==== SEC:APP/IDS (BEGIN) ====
// Globally unique IDs so multi-device merges can't collide.
// deviceId is per-install (kept outside the DB, never synced). New ids
// are "{dev}-{letter}{n}"; counters are derived on boot by scanning
// this device's own ids, so they need no persistence of their own.
function deviceId(){
  let d=null; try{ d=localStorage.getItem('capturelog.device'); }catch(e){}
  if(!d){
    const c=window.crypto;
    // SEC:APP/IDS: prefer strong device IDs for cross-device uniqueness.
    if(c&&typeof c.randomUUID==='function') d=c.randomUUID();
    else if(c&&typeof c.getRandomValues==='function'){
      const b=new Uint8Array(16); c.getRandomValues(b);
      d=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    } else d=(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14));
    try{ localStorage.setItem('capturelog.device',d); }catch(e){} }
  return d; }
let COUNTERS={};
function initCounters(){
  const dev=deviceId(); COUNTERS={};
  const scan=(arr,letter)=>{ let mx=0; const pre=dev+'-'+letter;
    arr.forEach(r=>{ if(typeof r.id==='string'&&r.id.startsWith(pre)){
      const n=parseInt(r.id.slice(pre.length),10); if(n>mx)mx=n; } });
    COUNTERS[letter]=mx+1; };
  scan(DB.entries,'e'); scan(DB.edges,'g'); scan(DB.linkTypes,'t');
  scan(DB.views,'v'); scan(DB.tabs,'b'); }
function newId(letter){ return deviceId()+'-'+letter+(COUNTERS[letter]++); }

// One-shot migration of legacy numeric ids: ids become device-prefixed
// strings; every reference field is rewritten via the old->new maps;
// updated_at is backfilled; tabs get explicit pos.
function migrateIds(){
  const s=DB.settings;
  if(s.idsMigrated){ return; }
  const dev=deviceId();
  const mk=(arr,letter)=>{ const m=new Map();
    arr.forEach(r=>{ const nid=dev+'-'+letter+r.id; m.set(r.id,nid); r.id=nid;
      if(!r.updated_at) r.updated_at=r.created_at||nowISO(); });
    return m; };
  const em=mk(DB.entries,'e'), gm=mk(DB.edges,'g'), tm=mk(DB.linkTypes,'t'),
        vm=mk(DB.views,'v'), bm=mk(DB.tabs,'b');
  DB.edges.forEach(d=>{ d.from_id=em.get(d.from_id)??d.from_id;
    d.to_id=em.get(d.to_id)??d.to_id; d.type_id=tm.get(d.type_id)??d.type_id; });
  DB.views.forEach(v=>{ v.cond_ids=(v.cond_ids||[]).map(x=>em.get(x)??x);
    v.type_ids=(v.type_ids||[]).map(x=>tm.get(x)??x); });
  DB.tabs.forEach((t,i)=>{ if(t.pos==null)t.pos=i+1; const c=t.cfg||{};
    if(c.root_id!=null)c.root_id=em.get(c.root_id)??c.root_id;
    ['view_id'].forEach(k=>{ if(c[k]!=null)c[k]=vm.get(c[k])??c[k]; });
    if(c.def&&c.def.links)c.def.links.forEach(l=>{ l.to=em.get(l.to)??l.to;
      l.type=tm.get(l.type)??l.type; }); });
  if(s.allViewId!=null) s.allViewId=vm.get(s.allViewId)??s.allViewId;
  const mem={};
  Object.entries(s.mem||{}).forEach(([k,val])=>{
    const nk=k.replace(/^tab(\d+)\./,(_,n)=>'tab'+(bm.get(+n)??n)+'.');
    mem[nk]=vm.get(val)??tm.get(val)??val; });
  s.mem=mem;
  if(DB.entries.length) s.dirty=true;      // real data present -> merges, never adopted-over
  s.idsMigrated=true; saveNow(); }
// ==== SEC:APP/IDS (END) ====

// CRUD. Soft delete everywhere; id + created_at immutable (P4).
// touch() bumps updated_at (the merge clock) and marks the DB dirty
// (i.e. containing more than seed data). Every mutation must touch.
function touch(r){ r.updated_at=nowISO(); DB.settings.dirty=true; }

function createEntry(f={}){ const t=nowISO();
  const e={id:newId('e'),created_at:t,ts:t,updated_at:t,
    title:null,body:null,estimate_min:null,deleted:0,...f};
  DB.entries.push(e); DB.settings.dirty=true; save(); return e; }
function getEntry(id){ return DB.entries.find(e=>e.id===id&&!e.deleted); }
function updateEntry(id,p){ const e=getEntry(id); if(!e)return null;
  delete p.id; delete p.created_at; Object.assign(e,p); touch(e); save(); return e; }
function deleteEntry(id){ const e=getEntry(id); if(!e)return;
  e.deleted=1; touch(e);
  DB.edges.forEach(d=>{ if(d.from_id===id||d.to_id===id){d.deleted=1;touch(d);} }); save(); }

function addEdge(from_id,to_id,type_id){ if(from_id===to_id) return null;
  const dup=DB.edges.find(d=>!d.deleted&&d.from_id===from_id&&d.to_id===to_id&&d.type_id===type_id);
  if(dup) return dup;
  const t=nowISO();
  const d={id:newId('g'),from_id,to_id,type_id,created_at:t,updated_at:t,deleted:0};
  DB.edges.push(d); DB.settings.dirty=true; save(); return d; }
function removeEdge(id){ const d=DB.edges.find(x=>x.id===id); if(d){d.deleted=1;touch(d);save();} }
function retypeEdge(id,type_id){ const d=DB.edges.find(x=>x.id===id&&!x.deleted);
  if(d){d.type_id=type_id;touch(d);save();} }
function reverseEdge(id){ const d=DB.edges.find(x=>x.id===id&&!x.deleted);
  if(d){ const f=d.from_id; d.from_id=d.to_id; d.to_id=f; touch(d); save(); } }
const liveEdges=()=>DB.edges.filter(d=>!d.deleted);

function createLinkType(name,locked=0){ const t0=nowISO();
  const t={id:newId('t'),name,locked,updated_at:t0,deleted:0};
  DB.linkTypes.push(t); DB.settings.dirty=true; save(); return t; }
function getType(id){ return DB.linkTypes.find(t=>t.id===id&&!t.deleted); }
// Hard-coded ANCHOR entries the workflow tabs are built around. Fixed
// seed ids make them safe to materialize lazily on stores seeded
// before an anchor existed: every device mints the identical record,
// so the sync merge unions the copies into one. A tombstoned anchor is
// undeleted (the tabs need it); a deliberately removed parent edge is
// respected once the edge record exists.
const ANCHORS={
  status:      {id:'seed-e-status',      title:'Status'},
  activity:    {id:'seed-e-activity',    title:'Activity'},
  person:      {id:'seed-e-person',      title:'Person'},
  place:       {id:'seed-e-place',       title:'Place'},
  personal:    {id:'seed-e-personal',    title:'Personal'},
  professional:{id:'seed-e-professional',title:'Professional'},
  i:           {id:'seed-e-i',           title:'I'},
  project:     {id:'seed-e-project',     title:'Project'},
  active:      {id:'seed-e-active',      title:'Active',   parent:'status', edge:'seed-g-active-status'},
  todo:        {id:'seed-e-todo',        title:'To-Do',    parent:'status', edge:'seed-g-todo-status'},
  noted:       {id:'seed-e-noted',       title:'Noted',    parent:'status', edge:'seed-g-noted-status'},
  deferred:    {id:'seed-e-deferred',    title:'Deferred', parent:'status', edge:'seed-g-deferred-status'},
  cancelled:   {id:'seed-e-cancelled',   title:'Cancelled',parent:'status', edge:'seed-g-cancelled-status'},
  missed:      {id:'seed-e-missed',      title:'Missed',   parent:'status', edge:'seed-g-missed-status'} };
// Seed-id accessors for the sixteen types, with a name-lookup courtesy
// fallback. ensureSeedLinkTypes() guarantees the seed ids at boot.
function relTid(seedId,name){ if(getType(seedId)) return seedId;
  const t=liveTypes().find(x=>x.name===name); return t?t.id:seedId; }
function isaTid(){ return relTid('seed-t-isa','is a'); }
function partofTid(){ return relTid('seed-t-partof','part of'); }
function ofTid(){ return relTid('seed-t-of','of'); }
function isTid(){ return relTid('seed-t-is','is'); }
function complementsTid(){ return relTid('seed-t-complements','complements'); }
function byTid(){ return relTid('seed-t-by','by'); }
function doingTid(){ return relTid('seed-t-doing','doing'); }
function objectTid(){ return relTid('seed-t-object','object'); }
function recipientTid(){ return relTid('seed-t-recipient','recipient'); }
function beneficiaryTid(){ return relTid('seed-t-beneficiary','beneficiary'); }
function complementTid(){ return relTid('seed-t-complement','complement'); }
function withTid(){ return relTid('seed-t-with','with'); }
function atTid(){ return relTid('seed-t-at','at'); }
function untilTid(){ return relTid('seed-t-until','until'); }
function dueTid(){ return relTid('seed-t-due','due'); }
function fulfillsTid(){ return relTid('seed-t-fulfills','fulfills'); }
function structTids(){ return [isaTid(),partofTid(),ofTid()]; }
function anchor(key){
  const a=ANCHORS[key];
  let e=DB.entries.find(x=>x.id===a.id);
  if(!e){ const t=nowISO();
    e={id:a.id,created_at:t,ts:t,updated_at:t,title:a.title,body:null,estimate_min:null,deleted:0};
    DB.entries.push(e); DB.settings.dirty=true; save(); }
  else if(e.deleted){ e.deleted=0; e.updated_at=nowISO(); DB.settings.dirty=true; save(); }
  if(a.parent){
    const p=anchor(a.parent);
    if(!DB.edges.find(d=>d.id===a.edge)){ const t=nowISO();
      DB.edges.push({id:a.edge,from_id:a.id,to_id:p.id,type_id:isaTid(),
        created_at:t,updated_at:t,deleted:0});
      DB.settings.dirty=true; save(); } }
  return e; }
const liveTypes=()=>DB.linkTypes.filter(t=>!t.deleted);

function createView(f){ const t0=nowISO();
  const v={id:newId('v'),name:'view',cond_ids:[],type_ids:[],locked:0,updated_at:t0,deleted:0,...f};
  DB.views.push(v); DB.settings.dirty=true; save(); return v; }
function getView(id){ return DB.views.find(v=>v.id===id&&!v.deleted); }
const liveViews=()=>DB.views.filter(v=>!v.deleted);
function fallbackView(){ return getView(DB.settings.allViewId)||liveViews()[0]; }

function createTab(cls,label,cfg={}){ const t0=nowISO();
  const pos=Math.max(0,...DB.tabs.filter(x=>!x.deleted).map(x=>x.pos||0))+1;
  const t={id:newId('b'),cls,label,pos,cfg,updated_at:t0,deleted:0};
  DB.tabs.push(t); DB.settings.dirty=true; save(); return t; }
function getTab(id){ return DB.tabs.find(t=>t.id===id&&!t.deleted); }
const liveTabs=()=>DB.tabs.filter(t=>!t.deleted).sort((a,b)=>(a.pos||0)-(b.pos||0));

// per-field view memory: fieldKey -> view id
const Mem={
  get(key,fb){ const id=DB.settings.mem[key]; return getView(id)||getView(fb)||fallbackView(); },
  set(key,viewId){ DB.settings.mem[key]=viewId; save(); } };

// ==== SEC:APP/SEED (BEGIN) ====
// First run: seed link types, keystone entries, views, and the default
// tab set. Seed records carry FIXED ids ('seed-…'), identical on every
// device, so independently seeded stores contain literally the same
// records and the sync merge (SEC:APP/MERGE) unions them into a single
// copy of each. Everything seeded is ordinary data — retitle,
// reconfigure, or (mostly) delete at will. "All" and the engine tabs
// are locked.
function seed(){
  if(DB.linkTypes.length||DB.entries.length) return;
  const t0=nowISO();
  const mkType=(id,name)=>{ const t={id,name,locked:1,updated_at:t0,deleted:0};
    DB.linkTypes.push(t); return t; };
  const mkEntry=(id,title)=>{ const e={id,created_at:t0,ts:t0,updated_at:t0,
    title,body:null,estimate_min:null,deleted:0}; DB.entries.push(e); return e; };
  const mkEdge=(id,from,to,type)=>DB.edges.push({id,from_id:from.id,to_id:to.id,
    type_id:type.id,created_at:t0,updated_at:t0,deleted:0});
  const mkView=(id,f)=>{ const v={id,name:'view',cond_ids:[],type_ids:[],locked:0,
    updated_at:t0,deleted:0,...f}; DB.views.push(v); return v; };
  let pos=0;
  const mkTab=(id,cls,label,cfg)=>DB.tabs.push({id,cls,label,pos:++pos,cfg,
    updated_at:t0,deleted:0});
  const isa=mkType('seed-t-isa','is a');
  mkType('seed-t-partof','part of');   mkType('seed-t-of','of');
  mkType('seed-t-is','is');            mkType('seed-t-complements','complements');
  mkType('seed-t-by','by');            mkType('seed-t-doing','doing');
  mkType('seed-t-object','object');    mkType('seed-t-recipient','recipient');
  mkType('seed-t-beneficiary','beneficiary'); mkType('seed-t-complement','complement');
  mkType('seed-t-with','with');        mkType('seed-t-at','at');
  mkType('seed-t-until','until');      mkType('seed-t-due','due');
  mkType('seed-t-fulfills','fulfills');
  const status=mkEntry('seed-e-status','Status');
  mkEntry('seed-e-activity','Activity');
  mkEntry('seed-e-person','Person');
  mkEntry('seed-e-place','Place');
  mkEntry('seed-e-personal','Personal');
  mkEntry('seed-e-professional','Professional');
  mkEntry('seed-e-i','I');
  mkEntry('seed-e-project','Project');
  [['active','Active'],['todo','To-Do'],['noted','Noted'],
   ['deferred','Deferred'],['cancelled','Cancelled'],['missed','Missed']]
    .forEach(([k,t])=>{ const s=mkEntry('seed-e-'+k,t);
      mkEdge('seed-g-'+k+'-status',s,status,isa); });
  const all=mkView('seed-v-all',{name:'All',
    type_ids:['seed-t-isa','seed-t-partof','seed-t-of'],locked:1});
  DB.settings.allViewId=all.id;
  mkTab('seed-b-create','create','＋',{});
  mkTab('seed-b-inbox','inbox','❗',{});
  mkTab('seed-b-active','active','🕓',{});
  mkTab('seed-b-todo','todo','☑',{});
  mkTab('seed-b-explore','explore','🧭',{view_id:all.id});
  DB.settings.idsMigrated=true;   // fresh DBs are born with global ids
  DB.settings.dirty=false;
  saveNow({schedule:false});
}
// A workflow tab introduced after a store was first seeded
// materializes lazily at boot, like the anchors: the fixed id means
// concurrent devices mint the identical record and the merge unions
// them. Unlike anchors, a TOMBSTONED tab row is respected — deleting a
// tab is a real choice, so only a wholly absent record is created.
// The five 4.0 workflow tabs, by fixed id. On a store first seeded by
// an EARLIER version, seed() no-ops (the store isn't empty), so these
// would never appear and the bar would still hold that version's tabs.
// This boot pass reconciles the bar to the running code: it mints any
// missing 4.0 tab (fixed ids -> concurrent devices mint identical
// records, merge-safe) and RETIRES any live tab whose class this build
// can't render (vestigial 'now' / 'interval' / 'exclusive'). Tabs are
// UI configuration, not journal data, so reconciling them is safe and
// not a data migration — entries, edges, and links are left untouched.
const RENDERABLE_TAB_CLASSES=['create','inbox','active','todo','explore','views','links','tabs'];
const SEED_TABS=[
  {id:'seed-b-create', cls:'create', label:'\uFF0B'},
  {id:'seed-b-inbox',  cls:'inbox',  label:'\u2757'},
  {id:'seed-b-active', cls:'active', label:'\uD83D\uDD53'},
  {id:'seed-b-todo',   cls:'todo',   label:'\u2611'},
  {id:'seed-b-explore',cls:'explore',label:'\uD83E\uDDED'}];
function ensureSeedTabs(){
  let changed=false;
  SEED_TABS.forEach((s,i)=>{
    const t=DB.tabs.find(x=>x.id===s.id);
    if(!t){ DB.tabs.push({id:s.id,cls:s.cls,label:s.label,pos:i+1,
        cfg:s.cls==='explore'?{view_id:DB.settings.allViewId}:{},
        updated_at:nowISO(),deleted:0}); changed=true; }
    else if(t.deleted){ t.deleted=0; t.updated_at=nowISO(); changed=true; } });
  DB.tabs.forEach(t=>{ if(!t.deleted&&!RENDERABLE_TAB_CLASSES.includes(t.cls)){
    t.deleted=1; t.updated_at=nowISO(); changed=true; } });
  if(changed){ DB.settings.dirty=true; save(); } }
// Link types introduced after a store was first seeded materialize
// lazily at boot, like the anchors: the fixed ids mean concurrent
// devices mint identical records and the merge unions them. They are
// locked (the interval sheet and the explore interval rows are
// hard-coded around them), and a tombstoned one is undeleted, exactly
// as anchors are — the workflow needs it.
const SEED_LINK_TYPES=[
  {id:'seed-t-isa',name:'is a'},{id:'seed-t-partof',name:'part of'},
  {id:'seed-t-of',name:'of'},{id:'seed-t-is',name:'is'},
  {id:'seed-t-complements',name:'complements'},{id:'seed-t-by',name:'by'},
  {id:'seed-t-doing',name:'doing'},{id:'seed-t-object',name:'object'},
  {id:'seed-t-recipient',name:'recipient'},{id:'seed-t-beneficiary',name:'beneficiary'},
  {id:'seed-t-complement',name:'complement'},{id:'seed-t-with',name:'with'},
  {id:'seed-t-at',name:'at'},{id:'seed-t-until',name:'until'},
  {id:'seed-t-due',name:'due'},{id:'seed-t-fulfills',name:'fulfills'}];
function ensureSeedLinkTypes(){
  SEED_LINK_TYPES.forEach(s=>{
    const t=DB.linkTypes.find(x=>x.id===s.id);
    if(!t){ DB.linkTypes.push({id:s.id,name:s.name,locked:1,
        updated_at:nowISO(),deleted:0}); DB.settings.dirty=true; save(); }
    else if(t.deleted){ t.deleted=0; t.locked=1; t.updated_at=nowISO();
      DB.settings.dirty=true; save(); } }); }
// Anchors materialize on first access, but access alone would leave a
// record new to this release invisible until the first code path that
// happens to need it (Places waited on a From/To field, which waited
// on an activity under Travel, which waited on Places…). The boot
// pass touches every anchor so stores seeded before one existed grow
// it — and its parent edge — immediately.
function ensureAnchors(){ Object.keys(ANCHORS).forEach(anchor); }
// ==== SEC:APP/SEED (END) ====

// ==== SEC:APP/QUERY (BEGIN) ====
// All derived state. Containment is a per-view property: traversals
// take the view's type_ids. Nothing here writes.
function typeIdsOf(view){ return (view&&view.type_ids&&view.type_ids.length)
  ? view.type_ids : structTids(); }

function childrenOf(nodeId,typeIds){                 // edges child->parent
  return liveEdges().filter(d=>d.to_id===nodeId&&typeIds.includes(d.type_id))
    .map(d=>getEntry(d.from_id)).filter(Boolean); }
function parentEdgesOf(id){                          // all outgoing typed links
  return liveEdges().filter(d=>d.from_id===id)
    .map(d=>({edge:d,node:getEntry(d.to_id),type:getType(d.type_id)}))
    .filter(x=>x.node&&x.type); }
function parentsOf(id,typeIds){
  return parentEdgesOf(id).filter(x=>typeIds.includes(x.edge.type_id)).map(x=>x.node); }
function backlinksOf(id){
  return liveEdges().filter(d=>d.to_id===id)
    .map(d=>({edge:d,node:getEntry(d.from_id),type:getType(d.type_id)}))
    .filter(x=>x.node&&x.type); }

// Direct-membership test — "a member of [ref]" means a live edge of
// one of the given types pointing straight at ref: never other types,
// never grandmembers.
function isLinkedTo(id,targetId,typeIds){
  return liveEdges().some(g=>typeIds.includes(g.type_id)
    &&g.from_id===id&&g.to_id===targetId); }
// Structural members of an anchor: entries with a direct is a /
// part of / of edge to it (§8 of the design).
function membersOf(anchorKey){ return childrenOf(anchor(anchorKey).id,structTids()); }
function descendantSet(rootId,typeIds){              // excludes the root
  const out=new Set(),stack=[rootId];
  while(stack.length){ const cur=stack.pop();
    childrenOf(cur,typeIds).forEach(c=>{ if(!out.has(c.id)){out.add(c.id);stack.push(c.id);} }); }
  return out; }

// A view's matches: live entries that are descendants of EVERY condition
// (pure conjunction). No conditions = everything.
function viewMatches(view){
  const typeIds=typeIdsOf(view);
  const live=DB.entries.filter(e=>!e.deleted);
  if(!view||!view.cond_ids||!view.cond_ids.length) return new Set(live.map(e=>e.id));
  const sets=view.cond_ids.map(c=>descendantSet(c,typeIds));
  const out=new Set();
  live.forEach(e=>{ if(sets.every(s=>s.has(e.id))) out.add(e.id); });
  return out; }

// Tree structure within a match set: roots = matches with no matched
// parent; children restricted to matches. Downward-closed for ancestor
// conditions, so the tree is complete. Cycle-safe via render depth cap.
function matchedParents(id,matched,typeIds){
  return parentsOf(id,typeIds).filter(p=>matched.has(p.id)); }
function treeRoots(matched,typeIds){
  const roots=[];
  matched.forEach(id=>{ const e=getEntry(id); if(!e)return;
    if(!matchedParents(id,matched,typeIds).length) roots.push(e); });
  return roots.sort((a,b)=>b.ts.localeCompare(a.ts)); }
function matchedChildren(id,matched,typeIds){
  return childrenOf(id,typeIds).filter(c=>matched.has(c.id))
    .sort((a,b)=>a.created_at.localeCompare(b.created_at)); }   // stable sibling order


// Search within a view: fuzzy over title (or first line for untitled),
// ranked by score, titledness, inbound links, recency of being linked.
function inboundCount(id){ return liveEdges().filter(d=>d.to_id===id).length; }
function lastLinkedAt(id){ let t='';
  liveEdges().forEach(d=>{ if(d.to_id===id&&d.created_at>t)t=d.created_at; }); return t; }
function searchInView(q,view){
  const matched=viewMatches(view);
  return DB.entries.filter(e=>!e.deleted&&matched.has(e.id))
    .map(e=>({e,sc:fuzzy(q,e.title?e.title:(e.body||''))}))
    .filter(x=>x.sc>=0)
    .sort((a,b)=>(b.sc-a.sc)||((b.e.title?1:0)-(a.e.title?1:0))
      ||(inboundCount(b.e.id)-inboundCount(a.e.id))
      ||lastLinkedAt(b.e.id).localeCompare(lastLinkedAt(a.e.id))); }

// ---- The grammar layer ----------------------------------------------
// statusLinked: everything whose current state is the given status —
// a live `is` edge to that status entry. Via Active it defines the
// running intervals; via To-Do the ghosts; via Noted the inbox.
function statusLinked(anchorKey){
  const st=isTid(), aid=anchor(anchorKey).id, seen=new Set();
  return liveEdges().filter(g=>g.type_id===st&&g.to_id===aid)
    .map(g=>getEntry(g.from_id))
    .filter(e=>e&&!seen.has(e.id)&&seen.add(e.id)); }
function hasStatus(id,anchorKey){
  return isLinkedTo(id,anchor(anchorKey).id,[isTid()]); }
// Scoped exclusivity for `is`: setting a state removes any existing
// `is` link whose target shares an `is a` ancestor with the new one —
// statuses displace statuses, but `is` links into other lexicons are
// untouched. Exclusivity is a property of the lexicon, not the type.
function isaRoots(id,seen){ seen=seen||new Set(); if(seen.has(id)||seen.size>16) return seen;
  liveEdges().forEach(g=>{ if(g.type_id===isaTid()&&g.from_id===id&&!seen.has(g.to_id)){
    seen.add(g.to_id); isaRoots(g.to_id,seen); } });
  return seen; }
function setIs(id,targetId){
  const roots=isaRoots(targetId);
  liveEdges().forEach(g=>{ if(g.type_id===isTid()&&g.from_id===id){

// NDJSON, one typed object per line. Lossless over all five tables.

function serialize(){

    settings:{allViewId:DB.settings.allViewId,mem:DB.settings.mem}})];
  const dump=(arr,t)=>arr.forEach(o=>L.push(JSON.stringify({_t:t,...o})));

  dump(DB.views,'view'); dump(DB.tabs,'tab');

function parseNDJSON(text){

    else if(t==='linktype')nd.linkTypes.push(o); else if(t==='view')nd.views.push(o);

// ==== SEC:APP/MERGE (BEGIN) ====

// have a record, the newer updated_at wins whole-record (created_at as
// fallback clock). Deletes are just records whose tombstone flag rode
// in on a newer clock, so delete-vs-edit resolves by the same rule.
// Order-insensitive and idempotent: any stale file merges harmlessly.
// Seed records carry the same fixed ids everywhere (SEC:APP/SEED), so
// independently seeded stores union into one seed by construction.

    (nd[t]||[]).forEach(r=>{
      const l=local.get(r.id);
      if(!l) DB[t].push(r);
      else if(stampOf(r)>stampOf(l)) Object.assign(l,r); }); });

// Google Drive sync, organized around REALMS.
//
// A realm is one shared dataset, named by a short random string. Its
// state lives in a single Drive file, capturelog-sync-<realm>.ndjson,
// maintained by convergent pull-merge-push cycles (SEC:APP/MERGE). A
// well-known pointer file, capturelog-realm.json, records which realm
// this Drive account is currently on: {realm, generation}. generation
// is a monotonic counter, bumped each time a realm is minted.
//
// Every sync cycle begins by reading the pointer:
//  - pointer generation ABOVE this device's: the dataset was reset

//    wiped and re-seeded, and the device joins the pointer's realm.
//  - pointer generation BELOW this device's: the pointer is stale

//  - equal generations, different realms (two devices minted

//    the same verdict on every device, so all converge.
//  - no pointer: publish this device's realm (minting one if needed).
// A device that has data but no realm yet (used offline before its
// first sync) joins the pointer's realm WITHOUT a wipe; the ordinary
// merge unions its records in.

// mints a fresh realm at generation+1, wipes this device, and
// rewrites the pointer; every other device follows on its own next

//  - The token client is created fresh per request with callback AND

  // the pointer bump then propagates the restored state to every device.
  restoreSnapshot(file){

            (ptr&&Number.isFinite(+ptr.generation))?+ptr.generation:0);
          DB=nd;
          if(!DB.settings) DB.settings={};
          initCounters();
          UI.tabId=liveTabs()[0]?.id||null;
          saveNow({schedule:false});
          this.joinRealm(this.newRealmId(),base+1);

// ==== SEC:APP/UI/TREE (BEGIN) ====
// Shared collapsible entry tree: view-filtered, search-pruned, stable
// sibling order, per-context expand set, ⇊ recursive expand, and the
// per-row ＋ that creates the typed search text as a child of that row.
// opts: {view, q, expand:Set, onPick(e), extras(e)->[nodes], addType}
function renderTree(container,opts){
  const view=opts.view, typeIds=typeIdsOf(view);
  const matched=viewMatches(view);
  const q=(opts.q||'').trim();
  let include=matched, hits=null;
  if(q){ hits=new Set();
    matched.forEach(id=>{ const e=getEntry(id);
      if(e&&fuzzy(q,e.title?e.title:(e.body||''))>=0) hits.add(id); });
    include=new Set(hits);
    hits.forEach(id=>{                            // pull in ancestors of hits
      const stack=[id],seen=new Set([id]);
      while(stack.length){ const cur=stack.pop();
        matchedParents(cur,matched,typeIds).forEach(p=>{
          if(!seen.has(p.id)){ seen.add(p.id); include.add(p.id); stack.push(p.id); } }); } }); }

  const roots=treeRoots(include,typeIds);
  if(!roots.length){ container.appendChild(el('div','empty',
    q?'No matches. Tap ＋ on a row to create “'+q+'” there.':'Nothing here yet.')); return; }

  const draw=(e,depth,seen)=>{
    if(seen.has(e.id)||depth>12) return;          // DAG/cycle guard
    seen.add(e.id);
    const kids=matchedChildren(e.id,include,typeIds);
    const open=q? true : opts.expand.has(e.id);   // search auto-expands
    const row=el('div','trow'); row.style.paddingLeft=(2+depth*24)+'px';
    if(kids.length){
      const chev=el('button','chev',open?'▾':'▸');
      chev.addEventListener('click',ev=>{ ev.stopPropagation();
        open?opts.expand.delete(e.id):opts.expand.add(e.id); opts.refresh(); });
      row.appendChild(chev);
    } else {
      row.appendChild(el('span','chev'));   // blank slot: leaf names align
    }
    const nm=el('button','nm'+dispCls(e)+((hits&&hits.has(e.id))?' hit':''),disp(e));
    nm.style.textAlign='left';
    nm.addEventListener('click',()=>opts.onPick(e));
    row.appendChild(nm);
    if(kids.length) row.appendChild(el('span','cnt',String(kids.length)));
    if(q){ const add=el('button','tbtn add','＋'); add.title='Create “'+q+'” under this';
      add.addEventListener('click',ev=>{ ev.stopPropagation();
        const n=createEntry({title:q});
        addEdge(n.id,e.id,opts.addType||typeIds[0]);
        toast('Created under '+disp(e)); opts.refresh(); });
      row.appendChild(add); }
    if(opts.extras) opts.extras(e).forEach(x=>row.appendChild(x));
    container.appendChild(row);
    if(open) kids.forEach(k=>draw(k,depth+1,seen));
    seen.delete(e.id);
  };
  roots.forEach(r=>draw(r,0,new Set()));
}

// Chip builders shared by editor / create tab / config screens.
function entryChip(e,{onTap,onRemove,typeLabel,onTypeTap,cls}={}){
  const c=el('button','chip '+(cls||''));
  c.appendChild(el('span','nm',disp(e)));
  if(typeLabel){ const t=el('span','ty',typeLabel);
    if(onTypeTap) t.addEventListener('click',ev=>{ev.stopPropagation();onTypeTap();});
    c.appendChild(t); }
  if(onRemove){ const x=el('span','x','×');
    x.addEventListener('click',ev=>{ev.stopPropagation();onRemove();}); c.appendChild(x); }
  if(onTap) c.addEventListener('click',onTap);
  return c; }
// EXPANDABLE CHIP CLOUDS. Clouds start restricted to a top-level
// lexicon; a chip whose entry has incoming links of opts.expandTids
// (default opts.childTids) earns a ＋ that dismisses the cloud and
// repopulates it with everything linking to that entry via
// opts.childTids; ⬑ climbs back out. st carries {root, trail, meta}
// across repaints; meta is caller-defined per-level baggage
// (opts.onExpand(entry, prevRootId, prevMeta) -> new meta).
//   top()                       entries of the unexpanded cloud
//   childTids                   incoming link types populating a level
//   expandTids                  incoming link types earning a ＋
//   noExpand(e)                 suppress the ＋ for this chip
//   filter(list)                per-draw list transform (search etc.)
//   renderChip(container,e,rootId,draw)  append the chip itself
//   extras(container,rootId,draw)        trailing adders etc.
//   emptyMsg                    string or () => string
function expandableCloud(container,st,opts){
  st.trail=st.trail||[];
  const draw=()=>{ container.innerHTML='';
    const rootId=st.root||null;
    if(rootId){ const up=el('button','chip','⬑ '+handle(rootId));
      up.addEventListener('click',()=>{ const prev=st.trail.pop()||{};
        st.root=prev.root||null; st.meta=prev.meta||null; draw(); });
      container.appendChild(up); }
    let items=rootId?childrenOf(rootId,opts.childTids||[]):opts.top();
    const seen=new Set(); items=items.filter(x=>x&&!seen.has(x.id)&&seen.add(x.id));
    if(opts.filter) items=opts.filter(items);
    items.sort(chipCmp).forEach(x=>{
      opts.renderChip(container,x,rootId,draw);
      const canExpand=!(opts.noExpand&&opts.noExpand(x))
        &&childrenOf(x.id,opts.expandTids||opts.childTids||[]).length>0;
      if(canExpand){
        const plus=el('button','chip add','＋');
        plus.title='Show what links to '+handle(x);
        plus.addEventListener('click',()=>{
          st.trail.push({root:st.root||null,meta:st.meta||null});
          if(opts.onExpand) st.meta=opts.onExpand(x,rootId,st.meta);
          st.root=x.id; draw(); });
        container.appendChild(plus); } });
    if(!items.length&&opts.emptyMsg)
      container.appendChild(el('span','empty slim',
        typeof opts.emptyMsg==='function'?opts.emptyMsg():opts.emptyMsg));
    if(opts.extras) opts.extras(container,rootId,draw); };
  draw(); return draw; }
// links field: existing typed links as chips + a "link…" adder that runs
// picker (view remembered per fieldKey) then applies the field's
// remembered link type silently; tap the type label on a chip to retype.
function linksField(container,entryId,fieldKey,afterChange){
  const wrap=el('div','chiprow');
  parentEdgesOf(entryId).forEach(({edge,node,type})=>{
    wrap.appendChild(entryChip(node,{cls:'linked',
      typeLabel:type.name,
      onTypeTap:()=>pickType(t=>{retypeEdge(edge.id,t.id);
        DB.settings.mem[fieldKey+'.type']=t.id; save(); afterChange();},
        {onReverse:()=>{reverseEdge(edge.id);afterChange();}}),
      onRemove:()=>{removeEdge(edge.id);afterChange();},
      onTap:()=>openEditor(node.id)})); });
  const add=el('button','chip add','⌕ link…');
  add.addEventListener('click',()=>{
    pickEntry(fieldKey,e=>{
      const tKey=fieldKey+'.type';
      const remembered=getType(DB.settings.mem[tKey]);
      const tid=(remembered||getType(isaTid())||liveTypes()[0]).id;
      addEdge(entryId,e.id,tid); afterChange(); }); });
  wrap.appendChild(add);
  container.appendChild(wrap); }
// The entry top row shared by the create tab and the editor: timestamp,
// title, and ＋. ＋ creates a new child entry and opens its editor as a
// stacked sheet whose offset keeps this row visible; each further ＋
// stacks and offsets again.
// Tap-to-edit timestamp: label per the display rules (time only when
// today; otherwise date over time, compactly stacked), with a hidden
// native input whose picker DIALOG is launched on tap via showPicker().
// tsFieldFor(get,set) works over any backing store — a live entry or
// the create tab's uncommitted draft; tsField(e) binds it to an entry.
function tsFieldFor(get,set){
  const box=el('div','tsbtn');

// ==== SEC:APP/UI/TAB_CREATE (BEGIN) ====
// "＋": the tab holds a DRAFT — nothing exists in the store until the
// ＋ button in the top row commits it. Selecting the tab (arriving
// from elsewhere or re-tapping it) resets an UNTOUCHED draft's
// timestamp to now; a draft with content stays exactly as it was
// left. Committing creates the entry (with the draft's timestamp and
// pending links) and clears the form back to the tab's defaults.
// Drafts persist per tab under their own localStorage key
// (capturelog.draft — device-local, never synced) so a killed page
// doesn't eat keystrokes; they hold pending link {to,type} pairs that
// become real edges only on commit.
const DRAFT_KEY='capturelog.draft';
let DRAFTS={};
try{ DRAFTS=JSON.parse(Store.read(DRAFT_KEY)||'{}')||{}; }catch(e){ DRAFTS={}; }
function saveDrafts(){ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(DRAFTS)); }catch(e){} }
function newDraft(tab){ const d=tab.cfg.def||{};
  return { ts:nowISO(), title:d.title||'', body:d.body||'',
    links:(d.links||[]).filter(l=>getEntry(l.to)).map(l=>({to:l.to,type:l.type})) }; }
function draftTouched(tab,d){ const f=newDraft(tab);
  return (d.title||'')!==f.title || (d.body||'')!==f.body
    || JSON.stringify(d.links||[])!==JSON.stringify(f.links); }
function freshenDraft(tab){ const d=DRAFTS[tab.id];
  if(!d||!draftTouched(tab,d)){ DRAFTS[tab.id]=newDraft(tab); saveDrafts(); } }
function commitDraft(tab){
  const d=DRAFTS[tab.id]; if(!d) return;
  const e=createEntry({ts:d.ts||nowISO(),
    title:(d.title||'').trim()||null, body:d.body||null});
  (d.links||[]).forEach(l=>{ if(getEntry(l.to)&&getType(l.type)) addEdge(e.id,l.to,l.type); });
  DRAFTS[tab.id]=newDraft(tab); saveDrafts();
  toast('Committed · '+disp(e)); UI.rerender(); }

function renderCreate(v,tab){
  if(!DRAFTS[tab.id]){ DRAFTS[tab.id]=newDraft(tab); saveDrafts(); }
  const d=DRAFTS[tab.id];
  d.links=(d.links||[]).filter(l=>getEntry(l.to));   // shed links to since-deleted entries

  const top=el('div','f-toprow');
  top.appendChild(tsFieldFor(()=>d.ts,iso=>{ d.ts=iso; saveDrafts(); }));
  const title=el('input','f-title'); title.placeholder='Title'; title.value=d.title||'';
  title.addEventListener('input',()=>{ d.title=title.value; saveDrafts(); });
  top.appendChild(title);
  const commit=el('button','tbtn-add','＋'); commit.title='Commit this entry';
  commit.addEventListener('click',()=>commitDraft(tab));
  top.appendChild(commit);
  v.appendChild(top);

  const body=el('textarea','f-body'); body.value=d.body||'';
  body.addEventListener('input',()=>{ d.body=body.value; saveDrafts(); });
  v.appendChild(body);

  v.appendChild(el('div','f-lbl','Links'));
  const lf=el('div','chiprow'); v.appendChild(lf);
  const fieldKey='tab'+tab.id+'.links';
  function drawLinks(){
    lf.innerHTML='';
    d.links.forEach((l,i)=>{
      const node=getEntry(l.to); if(!node) return;
      const type=getType(l.type);
      lf.appendChild(entryChip(node,{cls:'linked',
        typeLabel:type?type.name:'?',
        onTypeTap:()=>pickType(t=>{ l.type=t.id;
          DB.settings.mem[fieldKey+'.type']=t.id; save(); saveDrafts(); drawLinks(); }),
        onRemove:()=>{ d.links.splice(i,1); saveDrafts(); drawLinks(); },
        onTap:()=>openEditor(node.id)})); });
    const add=el('button','chip add','⌕ link…');
    add.addEventListener('click',()=>{
      pickEntry(fieldKey,ent=>{
        const remembered=getType(DB.settings.mem[fieldKey+'.type']);
        const tid=(remembered||getType(isaTid())||liveTypes()[0]).id;
        d.links.push({to:ent.id,type:tid}); saveDrafts(); }); });
    lf.appendChild(add); }
  drawLinks();
  setTimeout(()=>body.focus(),40);
}

// "❗" — the Noted inbox. The quick dumping spot: a field and ＋ that
// create {title, is -> Noted} in one gesture, asking nothing else.
// Below, everything currently Noted, newest first — the backlog of
// jottings awaiting formalization. Tapping a row opens the task sheet
// (SEC:APP/UI/EDIT_TASK) to retitle, set a real status, and attach the
// clauses that turn a jot into a sentence. Noted entries burn red in
// the runbar until triaged.
function renderInbox(v,tab){
  const st=tabState(tab.id);
  const row=el('div','f-toprow');
  const f=el('input','f-title'); f.placeholder='What must not slip…'; f.value=st.q||'';
  f.addEventListener('input',()=>{ st.q=f.value; });
  row.appendChild(f);
  const plus=el('button','tbtn-add','＋'); plus.title='Note it';
  plus.addEventListener('click',()=>{ const t=(st.q||'').trim(); if(!t) return;
    const e=createEntry({title:t});
    addEdge(e.id,anchor('noted').id,isTid());
    st.q=''; toast('Noted'); UI.rerender(); });
  row.appendChild(plus);
  v.appendChild(row);
  const list=statusLinked('noted').sort((a,b)=>b.ts.localeCompare(a.ts));
  if(!list.length){ v.appendChild(el('div','empty','Inbox zero.')); return; }
  list.forEach(e=>{
    const r=el('div','trow');
    r.appendChild(el('span','chev','❗'));
    const nm=el('button','nm'+dispCls(e),handle(e)); nm.style.textAlign='left';
    nm.addEventListener('click',()=>openTaskSheet(e.id));
    r.appendChild(nm);
    v.appendChild(r); });
  setTimeout(()=>f.focus(),40);
}

// ==== SEC:APP/UI/TAB_ACTIVE (BEGIN) ====
// "🕓" — the active intervals tab. An interval is active while its
// begin entry carries `is` -> Active; there is no containment root,
// and a begin entry that is simply never marked Active (an
// inauguration, a years-long role) clocks nowhere — legitimately
// unended. Rows are running clocks wearing their verb phrase; tapping
// one opens the interval sheet. The CHIP CLOUD below offers only
// direct `is a` members of Activity, plus everything `is` -> To-Do or
// `is` -> Noted. A chip with incoming `part of` / `of` links grows a
// ＋ that dismisses the cloud and repopulates it with everything
// linking to that chip via part of / of / is a / complements (⬑
// climbs back). SELECTION: if the expansion path used to reach the
// tapped chip crossed a `complements` link, or the tapped entry has
// exactly one outgoing `complements` link, the interval is minted
// doing -> that complements target with object -> the tapped entry;
// otherwise doing -> the tapped entry. A chip whose entry has exactly
// one INCOMING `complements` link wears its source's title inline,
// needs no ＋, and taps as that source (doing -> the chip's entry,
// object -> the source). Typing filters the current level; the
// ancestor match walks complements / of / is a upward, so "asr" keeps
// ASR/…/Invoices. ＋ by the field mints a titled `is a` member of
// Activity and starts it at once.
function concludeInterval(e){
  let en=endEntryOf(e.id);
  if(en) updateEntry(en.id,{ts:nowISO()});
  else { en=createEntry(); addEdge(e.id,en.id,untilTid()); }
  clearIs(e.id,anchor('active').id);
  toast('Ended · '+fmtDur(Date.now()-new Date(e.ts)));
  return en; }
function verbCloudItems(){
  const seen=new Set(), out=[];
  const add=e=>{ if(e&&!seen.has(e.id)){ seen.add(e.id); out.push(e); } };
  childrenOf(anchor('activity').id,[isaTid()]).forEach(add);
  statusLinked('todo').forEach(add);
  statusLinked('noted').forEach(add);
  return out; }
function renderActive(v,tab){
  const st=tabState(tab.id);
  const active=activeIntervals();
  if(!active.length) v.appendChild(el('div','empty slim','Just Being'));
  active.forEach(e=>{
    const row=el('div','trow');
    row.appendChild(el('span','chev','▶'));
    const nm=el('button','nm',intervalLabel(e)); nm.style.textAlign='left';
    nm.addEventListener('click',()=>openIntervalEditor(e.id));
    row.appendChild(nm);
    row.appendChild(el('span','cnt',fmtDur(Date.now()-new Date(e.ts))));
    const end=el('button','tbtn end','end now');
    end.addEventListener('click',()=>{ concludeInterval(e); UI.rerender(); });
    row.appendChild(end);
    v.appendChild(row); });
  const begin=(a,comp)=>{ const e=createEntry();
    if(comp){ addEdge(e.id,comp.id,doingTid()); addEdge(e.id,a.id,objectTid()); }
    else addEdge(e.id,a.id,doingTid());
    addEdge(e.id,anchor('active').id,isTid()); };
  const row=el('div','f-toprow');
  const f=el('input','f-title'); f.placeholder='Start…'; f.value=st.q||'';
  row.appendChild(f);
  const plus=el('button','tbtn-add','＋'); plus.title='New activity, started';
  plus.addEventListener('click',()=>{ const t=(st.q||'').trim(); if(!t) return;
    const a=createEntry({title:t}); addEdge(a.id,anchor('activity').id,isaTid());
    begin(a); st.q=''; toast('Started · '+t); UI.rerender(); });
  row.appendChild(plus);
  v.appendChild(row);
  const cloud=el('div','chipcloud'); v.appendChild(cloud);
  st.cloud=st.cloud||{trail:[]};
  const cm=complementsTid();
  const compEdge=(fromId,toId)=>liveEdges().some(g=>g.type_id===cm
    &&g.from_id===fromId&&g.to_id===toId);
  const soleIncomingComp=x=>{ const es=liveEdges().filter(g=>g.type_id===cm
      &&g.to_id===x.id&&getEntry(g.from_id));
    return es.length===1?getEntry(es[0].from_id):null; };
  const soleOutgoingComp=x=>{ const es=liveEdges().filter(g=>g.type_id===cm
      &&g.from_id===x.id&&getEntry(g.to_id));
    return es.length===1?getEntry(es[0].to_id):null; };
  const up=id=>liveEdges().filter(g=>g.from_id===id
      &&[complementsTid(),ofTid(),isaTid(),partofTid()].includes(g.type_id))
    .map(g=>g.to_id);
  const searchFilter=items=>{
    const q=(st.q||'').trim(); if(!q) return items;
    const memo=new Map();
    const ok=id=>{ if(memo.has(id)) return memo.get(id);
      memo.set(id,false);                          // cycle guard
      const e=getEntry(id); if(!e) return false;
      let m=fuzzy(q,e.title?e.title:(e.body||''))>=0;
      if(!m) m=up(id).some(ok);
      memo.set(id,m); return m; };
    return items.filter(e=>ok(e.id)); };
  const start=(a,comp)=>{ begin(a,comp); st.q=''; st.cloud={trail:[]};
    toast('Started · '+(comp?handle(comp)+' ':'')+handle(a)); UI.rerender(); };
  const drawCloud=expandableCloud(cloud,st.cloud,{
    top:verbCloudItems,
    childTids:[partofTid(),ofTid(),isaTid(),complementsTid()],
    expandTids:[partofTid(),ofTid()],
    noExpand:x=>!!soleIncomingComp(x),
    filter:searchFilter,
    onExpand:(x,rootId,meta)=>(rootId&&compEdge(x.id,rootId))?rootId:meta,
    renderChip:(rw,x,rootId)=>{
      const S=soleIncomingComp(x);
      const label=S?handle(x)+' '+(S.title||disp(S)):handle(x);
      const c=el('button','chip'+((x.title||S)?'':' untitled'),label);
      c.addEventListener('click',()=>{
        if(S){ start(S,x); return; }               // path: S -complements-> x
        let comp=null;
        if(rootId&&compEdge(x.id,rootId)) comp=getEntry(rootId);
        if(!comp&&st.cloud.meta) comp=getEntry(st.cloud.meta);
        if(!comp) comp=soleOutgoingComp(x);
        start(x,comp); });
      rw.appendChild(c); },
    emptyMsg:()=>((st.q||'').trim()?'No matches.':'No verbs yet — type one and ＋.')});
  f.addEventListener('input',()=>{ st.q=f.value; drawCloud(); });
  f.setAttribute('autofocus','');
  f.focus(); setTimeout(()=>{ if(document.activeElement!==f) f.focus(); },250);
}

// ==== SEC:APP/UI/TAB_EXPLORE (BEGIN) ====
// "🧭": view field at top, then the entry tree (or a flat date-sorted
// list with canonical paths). Tapping an entry opens its editor —
// except concluded intervals in the flat list, whose combined row
// opens the interval sheet (SEC:APP/UI/EDIT_INTERVAL) instead.
function viewField(container,fieldKey,fbId,onChange){
  const view=Mem.get(fieldKey,fbId);
  const f=el('button','f-field',view?('view: '+view.name):'view');
  f.addEventListener('click',()=>pickView(vw=>{Mem.set(fieldKey,vw.id);onChange();}));
  container.appendChild(f); return view; }

function renderExplore(v,tab){
  const st=tabState(tab.id); st.expand=st.expand||new Set();
  st.sort=st.sort==='tree'?'tree':'ts';        // time is the default
  const vrow=el('div','f-row'); vrow.style.flexWrap='nowrap';
  const view=viewField(vrow,'tab'+tab.id+'.view',tab.cfg.view_id,()=>UI.rerender());
  const sortBtn=el('button','sorttog',st.sort==='tree'?'tree':'by time');
  sortBtn.addEventListener('click',()=>{ st.sort=st.sort==='tree'?'ts':'tree'; UI.rerender(); });
  vrow.appendChild(sortBtn);
  v.appendChild(vrow);
  const q=el('input'); q.placeholder='Search'; q.style.cssText='width:100%;margin:10px 0;padding:9px 12px';
  q.value=st.q||''; q.addEventListener('input',()=>{st.q=q.value;redraw();});
  v.appendChild(q);
  const box=el('div','dense'); v.appendChild(box);

  function redraw(){
    box.innerHTML='';
    if(st.sort==='tree'){
      renderTree(box,{view,q:st.q,expand:st.expand,refresh:redraw,
        onPick:e=>openEditor(e.id)});
    } else {
      const matched=viewMatches(view);
      let list=[...matched].map(getEntry).filter(Boolean);
      if(st.q&&st.q.trim())
        list=list.filter(e=>fuzzy(st.q.trim(),e.title?e.title:(e.body||''))>=0);
      // THE DISPLAY GRAMMAR (design §12). Every flat row is one
      // sentence, wrapping as needed: a time lead, then any Status
      // states (`is` links whose target `is a` Status) colon-
      // terminated, then the sentence read off its outgoing clauses —
      //   [Status:] [subject] verb-phrase [recipients] [objects]
      //   [complements] — then the link clauses, joined by "and" —
      //   [is X] [is a X] [is part of X] [of X] [complements X]
      //   [with …] [at …|from X to Y] [for …] [due <t>] [fulfills …]
      //   : title [/ end title] . body [/ end body]
      // Bodies come after every title and link clause, with a '.'
      // closing the sentence before them. A titled entry with no
      // `doing` link and no Status state is led by "Articulated that".
      // ABSORPTION: exactly one `complements` and/or one `of` link is
      // absorbed into the printed title — complemented phrase, then
      // origin handle, then the title, bare-space-joined ("To-Do:
      // Submitted basket weaving grant") — and prints no clause of its
      // own; plural links print as clauses as usual.
      // An entry with an `until` target that is NOT Active is an
      // interval pair: lead becomes the begin–end range, the end
      // entry's own row is suppressed, from/to are the begin and end
      // entries' single `at` links, and the end's title/body trail the
      // begin's. `:` and `/` print only between two non-empty pieces;
      // `by` is suppressed for the first person; `of` shapes handles
      // everywhere and additionally prints as a clause when plural.
      const untilT=untilTid(), activeId=anchor('active').id, isT=isTid();
      const beg=new Map();                    // begin id -> end entry
      list.forEach(e=>{ if(hasStatus(e.id,'active')) return;
        const en=outOne(e.id,untilT); if(en) beg.set(e.id,en); });
      const consumed=new Set([...beg.values()].map(x=>x.id));
      list=list.filter(e=>beg.has(e.id)||!consumed.has(e.id));
      list.sort((a,b)=>b.ts.localeCompare(a.ts));
      if(!list.length){ box.appendChild(el('div','empty','No matches.')); return; }
      const first=s=>(s||'').split('\n')[0];
      const iId=anchor('i').id;
      list.slice(0,300).forEach(e=>{
        const endE=beg.get(e.id);
        const r=el('button','flatrow');
        const line=el('div','line');
        let lead;
        if(endE){
          const sameDay=new Date(e.ts).toDateString()===new Date(endE.ts).toDateString();
          lead=fmtDT(e.ts)+'–'+(sameDay?fmtDTParts(endE.ts).time:fmtDT(endE.ts));
        } else lead=fmtDT(e.ts);
        const hdr=[];
        const subj=outOne(e.id,byTid());
        if(subj&&subj.id!==iId) hdr.push(handle(subj));
        const verb=outOne(e.id,doingTid());
        // Absorption: a single complements / of link prefixes the
        // title (complemented phrase, then origin handle) instead of
        // printing as a clause.
        const compLinks=outAll(e.id,complementsTid());
        const ofLinks=outAll(e.id,ofTid());
        const oneComp=compLinks.length===1?compLinks[0]:null;
        const oneOf=ofLinks.length===1?ofLinks[0]:null;
        const titleText=[oneComp?verbPhrase(oneComp):'',
                         oneOf?handle(oneOf):'',
                         e.title||''].filter(Boolean).join(' ');
        // A verbless entry is its own subject noun: the title leads
        // ("Annual Report is part of ASR/Treasurer"); with a verb, the
        // title is trailing commentary after ':'.
        if(!verb&&titleText) hdr.push(titleText);
        if(verb) hdr.push(verbPhrase(verb));
        const recs=outAll(e.id,recipientTid());
        if(recs.length) hdr.push(recs.map(oblique).join(', '));
        const objs=outAll(e.id,objectTid());
        if(objs.length) hdr.push(objs.map(handle).join(', '));
        const comps=outAll(e.id,complementTid());
        if(comps.length) hdr.push(comps.map(handle).join(', '));
        // Statuses lead the row, colon-terminated; every other link
        // printout joins the clause list, "and"-separated.
        const statusRoot=anchor('status').id;
        const isLinks=outAll(e.id,isT);
        const stats=isLinks.filter(t=>isLinkedTo(t.id,statusRoot,[isaTid()]));
        const clauses=[];
        isLinks.filter(t=>!stats.includes(t))
          .forEach(t=>clauses.push('is '+handle(t)));
        outAll(e.id,isaTid()).forEach(t=>clauses.push('is a '+handle(t)));
        outAll(e.id,partofTid()).forEach(t=>clauses.push('is part of '+handle(t)));
        if(!oneOf) ofLinks.forEach(t=>clauses.push('of '+handle(t)));
        if(!oneComp) compLinks.forEach(t=>clauses.push('complements '+handle(t)));
        const withs=outAll(e.id,withTid());
        if(withs.length) clauses.push('with '+withs.map(oblique).join(', '));
        if(endE){
          const from=outAll(e.id,atTid()), to=outAll(endE.id,atTid());
          const loc=[];
          if(from.length===1) loc.push('from '+handle(from[0]));
          else if(from.length) loc.push('at '+from.map(handle).join(', '));
          if(to.length===1) loc.push('to '+handle(to[0]));
          else if(to.length) loc.push('at '+to.map(handle).join(', '));
          if(loc.length) clauses.push(loc.join(' '));  // from/to is one clause
        } else {
          const ats=outAll(e.id,atTid());
          if(ats.length) clauses.push('at '+ats.map(handle).join(', '));
        }
        const bens=outAll(e.id,beneficiaryTid());
        if(bens.length) clauses.push('for '+bens.map(oblique).join(', '));
        const dues=outAll(e.id,dueTid());
        if(dues.length) clauses.push('due '+dues.map(d=>fmtDT(d.ts)).join(', '));
        const fuls=[...outAll(e.id,fulfillsTid()),
                    ...(endE?outAll(endE.id,fulfillsTid()):[])];
        if(fuls.length) clauses.push('fulfills '+fuls.map(handle).join(', '));
        let txt=[hdr.join(' '),clauses.join(' and ')].filter(Boolean).join(' ');
        if(verb&&titleText) txt+=(txt?': ':'')+titleText;
        if(endE&&endE.title) txt+=(txt?' / ':'')+endE.title;
        // Bodies trail everything; a '.' closes the sentence first.
        const bodies=[first(e.body),endE?first(endE.body):''].filter(Boolean);
        if(bodies.length) txt=(txt?txt+'. ':'')+bodies.join(' / ');
        if(stats.length) txt=stats.map(handle).join(', ')+(txt?': '+txt:'');
        else if(e.title&&!verb) txt='Articulated that '+txt;
        line.appendChild(el('span','rng',lead));
        line.appendChild(el('span','nm',txt));
        r.appendChild(line);
        r.addEventListener('click',()=>{
          if(endE||hasStatus(e.id,'active')) openIntervalEditor(e.id);
          else if(hasStatus(e.id,'todo')||hasStatus(e.id,'noted')) openTaskSheet(e.id);
          else openEditor(e.id); });
        box.appendChild(r); });
    }
  }
  redraw();
}

// ==== SEC:APP/UI/TAB_TODO (BEGIN) ====
// "☑" — the ghosts. All and only entries `is` -> To-Do, due time on
// the right (overdue in red). The top field + ＋ mints a ghost
// {title, is -> To-Do} and opens the task sheet for its optional
// clauses. Tapping a row reopens the same sheet; tapping the ☐ tick
// box beside it runs the fulfillment gesture.
function renderTodo(v,tab){
  const st=tabState(tab.id);
  const row=el('div','f-toprow');
  const f=el('input','f-title'); f.placeholder='New to-do…'; f.value=st.q||'';
  f.addEventListener('input',()=>{ st.q=f.value; });
  row.appendChild(f);
  const plus=el('button','tbtn-add','＋'); plus.title='Create a to-do';
  plus.addEventListener('click',()=>{ const t=(st.q||'').trim(); if(!t) return;
    const e=createEntry({title:t});
    addEdge(e.id,anchor('todo').id,isTid());
    st.q=''; toast('To-do · '+t); UI.rerender();
    openTaskSheet(e.id); });
  row.appendChild(plus);
  v.appendChild(row);
  const list=statusLinked('todo').sort((a,b)=>b.ts.localeCompare(a.ts));
  if(!list.length){ v.appendChild(el('div','empty','Nothing to do.')); return; }
  const now=nowISO();
  list.forEach(e=>{
    const r=el('div','trow');
    const tick=el('button','chev','☐'); tick.title='Done';
    tick.addEventListener('click',()=>{ fulfillGhost(e.id,null); UI.rerender(); });
    r.appendChild(tick);
    const nm=el('button','nm'+dispCls(e),handle(e)); nm.style.textAlign='left';
    nm.addEventListener('click',()=>openTaskSheet(e.id));
    r.appendChild(nm);
    // The due clause may live on the ghost or on its promise wrapper.
    const d=outOne(e.id,dueTid())
      ||backlinksOf(e.id).filter(x=>x.edge.type_id===objectTid())
        .map(x=>outOne(x.node.id,dueTid())).find(Boolean)||null;
    if(d){ const c=el('span','cnt','due '+fmtDT(d.ts));
      if(d.ts<now) c.style.color='var(--red)';
      r.appendChild(c); }
    v.appendChild(r); });
}

    r.appendChild(del);

// ==== SEC:APP/UI/EDITOR (BEGIN) ====
// The entry editor: same anatomy as the create tab, plus backlinks and
// delete. ＋ in the top row births a child and stacks its editor.
function openEditor(entryId){
  Modal.push((m,body)=>{
    const e=getEntry(entryId);
    if(!e){ body.appendChild(el('div','empty','Entry was deleted.')); return; }
    body.appendChild(entryTopRow(e));
    const bd=el('textarea','f-body short'); bd.placeholder='Body'; bd.value=e.body||'';
    bd.addEventListener('input',()=>updateEntry(e.id,{body:bd.value||null}));
    body.appendChild(bd);

    body.appendChild(el('div','f-lbl','Links'));
    const lf=el('div'); body.appendChild(lf);
    linksField(lf,e.id,'editor.links',()=>Modal.refresh());

    const bl=backlinksOf(e.id);
    if(bl.length){
      body.appendChild(el('div','f-lbl','Linked from ('+bl.length+')'));
      const row=el('div','chiprow');
      bl.slice(0,20).forEach(({edge,node,type})=>
        row.appendChild(entryChip(node,{typeLabel:type.name,
          onTypeTap:()=>pickType(t=>{retypeEdge(edge.id,t.id);Modal.refresh();},
            {onReverse:()=>{reverseEdge(edge.id);Modal.refresh();}}),
          onRemove:()=>{removeEdge(edge.id);Modal.refresh();},
          onTap:()=>openEditor(node.id)})));
      body.appendChild(row); }

    const del=el('button','dangerbtn','Delete entry');
    del.addEventListener('click',()=>{ if(confirm('Delete this entry? (soft delete; links detach)')){
      deleteEntry(e.id); Modal.pop(); } });
    body.appendChild(del);
  });
}
